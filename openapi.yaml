      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PublicSite'
                  - $ref: '#/components/schemas/Envelope'
        '409': { description: slug/domain 冲突, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
        '422': { $ref: '#/components/responses/Error' }
  /api/workspaces/{workspaceId}/sites/{siteId}:
    get:
      tags: [sites]
      operationId: getSite
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/SiteId'
      responses:
        '200':
          description: 站点详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PublicSite'
                  - $ref: '#/components/schemas/Envelope'
        '404': { $ref: '#/components/responses/Error' }
    patch:
      tags: [sites]
      operationId: patchSite
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/SiteId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SitePatch' }
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PublicSite'
                  - $ref: '#/components/schemas/Envelope'
        '409': { description: revision 冲突, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
        '428': { $ref: '#/components/responses/Error' }
    delete:
      tags: [sites]
      operationId: disableSite
      description: 停用站点（软语义；公开面随之 404）
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/SiteId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 已停用
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PublicSite'
                  - $ref: '#/components/schemas/Envelope'
