        template: { type: string, enum: [blog, pro] }
        navigation_config: { type: object }
    PublicSection:
      type: object
      properties:
        type: { type: string, enum: [latest, featured, column] }
        title: { type: string }
        section_slug: { type: string }
        items:
          type: array
          items: { $ref: '#/components/schemas/PublicPost' }
    PublicSiteHome:
      type: object
      properties:
        site: { $ref: '#/components/schemas/PublicSiteInfo' }
        sections:
          type: array
          items: { $ref: '#/components/schemas/PublicSection' }
    PublicPost:
      type: object
      properties:
        asset_id: { type: string, format: uuid }
        display_path: { type: string }
        title: { type: string }
        summary: { type: string }
        content_kind: { type: string }
        tags:
          type: array
          items: { $ref: '#/components/schemas/TagSummary' }
        updated_at: { type: string, format: date-time, nullable: true }
        published_at: { type: string, format: date-time, nullable: true }
    PublicPostPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PublicPost' }
        next_cursor: { type: string }
        has_more: { type: boolean }
    PublicPostContent:
      type: object
      properties:
        asset_id: { type: string, format: uuid }
        display_path: { type: string }
        title: { type: string }
        summary: { type: string }
        markdown: { type: string, description: 正文 markdown 原文；渲染与净化由前端负责 }
        fields:
          type: object
          description: 按 field_schema 投影的白名单字段
        content_kind: { type: string }
        tags:
          type: array
          items: { $ref: '#/components/schemas/TagSummary' }
        updated_at: { type: string, format: date-time, nullable: true }
        published_at: { type: string, format: date-time, nullable: true }
        section_slug: { type: string }
    PublicTagFacets:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              key: { type: string }
              display_name: { type: string }
              count: { type: integer }
  responses:
    Error:
      description: v2 错误信封
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  parameters:
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PublicSiteSlug:
      name: slug
      in: path
      required: true
      schema: { type: string }
    SiteId:
      name: siteId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AssetId:
      name: assetId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DerivationId:
      name: derivationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MediaId:
      name: mediaId
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    InvitationId:
      name: invitationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MembershipId:
      name: membershipId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TagId:
      name: tagId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Cursor:
      name: cursor
      in: query
      schema: { type: string, nullable: true }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 200 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: string }
  schemas:
    QueryRequest:
      type: object
      properties:
        query:
          type: string
          description: 全文类 mode 必填，trim 后最多 1000 code point；structured 必须为空
        mode:
          type: string
          enum: [structured, fulltext, semantic, hybrid]
        resource_model_ids:
          type: array
          maxItems: 50
          items: { type: string, format: uuid }
        visibility:
          type: array
          items:
            type: string
            enum: [workspace, organization, public]
          description: 只能缩小 scope，超出返回 422
        tags_any:
          type: array
          maxItems: 50
          items: { type: string }
        tags_all:
          type: array
          maxItems: 50
          items: { type: string }
        tags_none:
          type: array
          maxItems: 50
          items: { type: string }
        field_filters:
          type: array
          maxItems: 40
          items: { $ref: '#/components/schemas/FieldFilter' }
        origins:
          type: array
          items:
            type: string
            enum: [human, imported, ai_generated, ai_assisted]
        confirmation_statuses:
          type: array
          items:
            type: string
            enum: [unconfirmed, human_confirmed]
        published_after: { type: string, format: date-time, nullable: true }
        published_before: { type: string, format: date-time, nullable: true }
        top_k: { type: integer, minimum: 1, maximum: 50, default: 20 }
        cursor: { type: string, nullable: true }
    FieldFilter:
      type: object
      required: [resource_model_id, field, operator]
      properties:
        resource_model_id: { type: string, format: uuid }
        field: { type: string }
        operator:
          type: string
          enum: [eq, neq, in, gt, gte, lt, lte, exists, contains, contains_any, contains_all]
        value: {}
    QueryResponse:
      type: object
      properties:
        requested_mode: { type: string, enum: [structured, fulltext, semantic, hybrid] }
        executed_mode: { type: string, enum: [structured, fulltext, semantic, hybrid] }
        ranking_method: { type: string, enum: [structured, fulltext, semantic, rrf, rerank] }
        degraded: { type: boolean }
        degradation_reasons:
          type: array
          items:
            type: string
            enum: [semantic_provider_unavailable, semantic_projection_incomplete, fulltext_unavailable, reranker_unavailable]
        session_id: { type: string, format: uuid }
        items:
          type: array
          items: { $ref: '#/components/schemas/QueryItem' }
        page:
          type: object
          properties:
            next_cursor: { type: string, nullable: true }
            has_more: { type: boolean }
        index:
          type: object
          nullable: true
          description: 只对全文类 mode 返回
          properties:
            profile_generation: { type: integer }
            indexed_through: { type: string, format: date-time, nullable: true }
            lag_seconds: { type: number }
    QueryItem:
      type: object
      properties:
        asset_id: { type: string, format: uuid }
        asset_version_id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
        resource_model_id: { type: string, format: uuid }
        title: { type: string }
        summary: { type: string }
        visibility: { type: string, enum: [workspace, organization, public] }
        origin: { type: string }
        confirmation_status: { type: string }
        published_at: { type: string, format: date-time, nullable: true }
        tags:
          type: array
          items: { $ref: '#/components/schemas/TagSummary' }
        score: { type: number, nullable: true }
        citation: { $ref: '#/components/schemas/Citation' }
    Citation:
      type: object
      properties:
        citation_id:
          type: string
          description: 服务端 opaque CitationRef（HMAC），不是可拼接 UUID
        source_type: { type: string }
        source_locator: { type: object }
        char_start: { type: integer }
        char_end: { type: integer }
        excerpt: { type: string }
        source_checksum: { type: string }
        chunk_checksum: { type: string }
        canonicalizer_version: { type: string }
    ValidatedReference:
      type: object
      properties:
        citation_ref: { type: string }
        asset_id: { type: string, format: uuid }
        asset_version_id: { type: string, format: uuid }
    RetrievalProfile:
      type: object
      properties:
        id: { type: string, format: uuid }
        generation: { type: integer }
        manifest_key: { type: string }
        canonicalizer_version: { type: string }
        chunker_version: { type: string }
        tokenizer_version: { type: string }
        semantic_enabled: { type: boolean }
        embedding_model: { type: string }
        embedding_model_version: { type: string }
        embedding_dimensions: { type: integer }
        status: { type: string, enum: [warming, active, retired, failed] }
        revision: { type: integer }
        created_at: { type: string, format: date-time }
        activated_at: { type: string, format: date-time }
    RetrievalRebuild:
      type: object
      description: 聚合计数，不含资产内容
      properties:
        id: { type: string, format: uuid }
        scope_type: { type: string, enum: [organization, workspace, resource_model, asset] }
        scope_id: { type: string }
        workspace_id: { type: string, format: uuid }
        reason: { type: string, enum: [profile_warming, manual, policy_changed, repair] }
        status: { type: string, enum: [queued, running, succeeded, partially_failed, failed, cancelled] }
        total_count: { type: integer }
        queued_count: { type: integer }
        ready_count: { type: integer }
        degraded_count: { type: integer }
        failed_count: { type: integer }
        requested_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time }
    QueryExecution:
      type: object
      description: 查询执行审计；不包含查询/过滤明文
      properties:
        id: { type: string, format: uuid }
        subject_kind: { type: string }
        channel: { type: string, enum: [workspace, agent, open_api, public_site] }
        requested_mode: { type: string }
        executed_mode: { type: string }
        ranking_method: { type: string }
        status: { type: string, enum: [started, succeeded, failed, interrupted] }
        degraded: { type: boolean }
        degradation_reasons:
          type: array
          items: { type: string }
        resource_model_count: { type: integer }
        result_count: { type: integer }
        stage_latency_ms: { type: object, additionalProperties: { type: number } }
        error_code: { type: string }
        embedding_model_identity: { type: string }
        reranker_model_identity: { type: string }
        started_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time }

    SuggestionKind:
      type: string
      enum: [field, summary, tag, relation]
    SuggestionStatus:
      type: string
      enum: [pending, accepted, rejected]
    RelationType:
      type: string
      enum: [related_to, references, derived_from, cites, continues_from]
    SuggestionItem:
      type: object
      description: 三类建议表的联合视图行；kind 决定哪些字段有值
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/SuggestionKind' }
        source_version_id: { type: string, format: uuid }
        run_id: { type: string, format: uuid }
        field_key:
          type: string
          description: 仅 field 建议返回
        value:
          type: object
          nullable: true
          description: field/summary 建议值（JSON 值 / 摘要文本）
        previous_value:
          type: object
          nullable: true
        suggested_key:
          type: string
          description: 仅 tag 建议返回（归一化 key）
        suggested_display_name:
          type: string
          description: 仅 tag 建议返回
        is_new:
          type: boolean
          description: 仅 tag 建议返回；true 表示建议创建新标签
        target_asset_id:
          type: string
          format: uuid
          description: 仅 relation 建议返回
        relation_type:
          allOf: [{ $ref: '#/components/schemas/RelationType' }]
          description: 仅 relation 建议返回
        confidence: { type: number, minimum: 0, maximum: 1 }
        status: { $ref: '#/components/schemas/SuggestionStatus' }
        citation:
          type: array
          nullable: true
          description: 引用依据（extraction/retrieval 引用，含 ref 与 snippet）
          items:
            type: object
            properties:
              kind: { type: string }
              ref: { type: string }
              snippet: { type: string }
        created_at: { type: string, format: date-time }
        reviewed_by: { type: string, format: uuid, nullable: true }
    SuggestionReviewOutcome:
      type: object
      properties:
        suggestion_id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/SuggestionKind' }
        draft_id: { type: string, format: uuid }
        draft_revision: { type: integer }
    BatchAcceptResponse:
      type: object
      properties:
        accepted:
          type: array
          items: { $ref: '#/components/schemas/SuggestionReviewOutcome' }
        failed:
          type: array
          description: 未落库的条目及原因（状态不合法、合并校验失败等）
          items:
            type: object
            properties:
              ref:
                type: object
                properties:
                  kind: { $ref: '#/components/schemas/SuggestionKind' }
                  suggestion_id: { type: string, format: uuid }
                  resolved_tag_id: { type: string, format: uuid }
              error: { type: string }
        draft_id: { type: string, format: uuid }
        draft_revision:
          type: integer
          description: 本次调用共享的 draft revision（恰 +1）
    ProcessingResult:
      type: object
      description: 一次 Agent 处理的可审计载体（§8.1 五要素）
      properties:
        id: { type: string, format: uuid }
        run_id: { type: string, format: uuid }
        input_version_id: { type: string, format: uuid }
        output_version_id:
          type: string
          format: uuid
          nullable: true
          description: 用户 commit 采纳建议产生版本后回填
        suggestion_summary:
          type: object
          nullable: true
          description: 建议计数汇总 {field,summary,tag,relation}
          additionalProperties: { type: integer }
        field_diff:
          type: array
          nullable: true
          items:
            type: object
            properties:
              key: { type: string }
              old: { nullable: true }
              new: { nullable: true }
              confidence: { type: number }
        overall_confidence: { type: number, nullable: true }
        created_at: { type: string, format: date-time }
    SuggestionList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SuggestionItem' }
        has_more: { type: boolean }
        next_cursor: { type: string, nullable: true }
        processing_results:
          type: array
          description: 同资产最近 10 条处理结果（队列头部摘要）
          items: { $ref: '#/components/schemas/ProcessingResult' }
    PrepareAccepted:
      type: object
      properties:
        run_id: { type: string, format: uuid }

    Envelope:
      type: object
      properties:
        request_id:
          type: string
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code: { type: string }
            message: { type: string }
            request_id: { type: string }
            details:
              type: object
              additionalProperties: true
              nullable: true
    CursorPage:
      type: object
      required: [next_cursor, has_more]
      properties:
        next_cursor: { type: string, nullable: true }
        has_more: { type: boolean }
    PublicationRequestStatus:
      type: string
      enum: [pending, approved, rejected, cancelled, scheduled]
    PublicationCancelReason:
      type: string
      enum: [user_cancelled, new_version, asset_archived, admin_cancelled, execution_failed]
    PublicationRequest:
      type: object
      properties:
        id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
        asset_id: { type: string, format: uuid }
        asset_version_id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/PublicationRequestStatus' }
        submitted_by: { type: string, format: uuid }
        decided_by: { type: string, format: uuid, nullable: true }
        decision_comment: { type: string, nullable: true }
        cancelled_by: { type: string, format: uuid, nullable: true }
        cancel_reason: { $ref: '#/components/schemas/PublicationCancelReason' }
        submitted_at: { type: string, format: date-time }
        decided_at: { type: string, format: date-time, nullable: true }
        scheduled_at: { type: string, format: date-time, nullable: true }
        executed_at: { type: string, format: date-time, nullable: true }
        revision: { type: integer }
    PublicationRequestListData:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PublicationRequest' }
        page: { $ref: '#/components/schemas/CursorPage' }
    PublicationComment:
      type: object
      properties:
        id: { type: string, format: uuid }
        publication_request_id: { type: string, format: uuid }
        body: { type: string }
        author_user_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
    PublicationBatchResult:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              request_id: { type: string, format: uuid }
              ok: { type: boolean }
              error_code: { type: string, nullable: true }
              request: { $ref: '#/components/schemas/PublicationRequest' }
    Asset:
      type: object
      properties:
        id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
        resource_model_id: { type: string, format: uuid }
        publication_status:
          type: string
          enum: [draft, published, archived]
        visibility:
          type: string
          enum: [workspace, organization, public]
        current_working_version_id: { type: string, format: uuid }
        current_published_version_id: { type: string, format: uuid, nullable: true }
        revision: { type: integer }
    AssetDraftPatch:
      type: object
      properties:
        title: { type: string, nullable: true }
        summary: { type: string, nullable: true }
        markdown: { type: string, nullable: true }
        fields: { type: object, additionalProperties: true, nullable: true }
        tag_ids:
          type: array
          maxItems: 100
          items: { type: string, format: uuid }
          description: 省略表示保留当前标签；传数组（可空）表示整组替换
    AssetDraft:
      type: object
      properties:
        asset_id: { type: string, format: uuid }
        base_version_id: { type: string, format: uuid }
        revision: { type: integer }
        committed_revision: { type: integer }
        title: { type: string }
        summary: { type: string }
        markdown: { type: string }
        fields: { type: object, additionalProperties: true }
        tags:
          type: array
          items: { $ref: '#/components/schemas/TagSummary' }
        updated_by: { type: string, format: uuid }
        updated_at: { type: string, format: date-time }
    TagSummary:
      type: object
      description: 草稿/版本/查询结果共用的标签摘要（不暴露裸字符串）
      properties:
        id: { type: string, format: uuid }
        key: { type: string, description: normalized key }
        display_name: { type: string }
        slug: { type: string }
        status:
          type: string
          enum: [active, archived]
    TagUsage:
      type: object
      properties:
        working_assets: { type: integer, format: int64 }
        published_assets: { type: integer, format: int64 }
        open_drafts: { type: integer, format: int64 }
    Tag:
      type: object
      properties:
        id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
        key: { type: string }
        display_name: { type: string }
        slug: { type: string }
        status:
          type: string
          enum: [active, archived]
        revision: { type: integer }
        created_by: { type: string, format: uuid }
        updated_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        archived_at: { type: string, format: date-time, nullable: true }
        etag: { type: string }
        usage:
