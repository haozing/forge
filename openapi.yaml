      tags: [conversations]
      operationId: updateNoteBlock
      description: 修改手动块内容（产生新块修订）；消息块为会话原始记录，不可改
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - name: blockId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string }
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/NoteBlock'
                  - $ref: '#/components/schemas/Envelope'
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      tags: [conversations]
      operationId: deleteNoteBlock
      description: 从活树移除块（块修订保留——已冻结版本引用它们）
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - name: blockId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 已移除
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          block_id: { type: string, format: uuid }
                  - $ref: '#/components/schemas/Envelope'
        '404': { $ref: '#/components/responses/Error' }
  /api/conversations/{conversationId}/derivations:
    post:
      tags: [conversations]
      operationId: createDerivation
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DerivationCreate' }
      responses:
        '201':
