      tags: [conversations]
      operationId: getConversationNote
      description: 笔记文档视图：冻结版本 + 活块树实时渲染（draft_markdown）与 dirty 状态。会话消息即是笔记的块；"保存"= POST /api/assets/{note_asset_id}/commit-draft
      parameters:
        - $ref: '#/components/parameters/ConversationId'
      responses:
        '200':
          description: 会话笔记视图
          content:
