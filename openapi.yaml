  /api/conversations/{conversationId}/note/blocks:
    get:
      tags: [conversations]
      operationId: listNoteBlocks
      description: 笔记文档的活块树（消息块与手动块统一列表，position 排序）
      parameters:
        - $ref: '#/components/parameters/ConversationId'
      responses:
        '200':
          description: 块列表与树 revision
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          revision: { type: integer }
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/NoteBlock' }
                  - $ref: '#/components/schemas/Envelope'
        '404': { $ref: '#/components/responses/Error' }
    post:
      tags: [conversations]
      operationId: addNoteBlock
      description: 向笔记文档追加一个块。两种入口：手动块（kind+content）；或存入笔记——从会话某条消息收录摘录（from_block_revision_id，正文取自该消息，kind 仅 quote/paragraph、缺省 quote，溯源记入块 props）。会话消息永不自动进笔记。
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                kind: { type: string, enum: [paragraph, heading, quote, code, list, callout], description: 手动块必填；收录摘录时仅 quote/paragraph（缺省 quote） }
                content: { type: string, description: 手动块必填；收录摘录时必须省略（正文取自消息） }
                from_block_revision_id: { type: string, format: uuid, description: 收录摘录：要存入笔记的消息 block_revision_id（须属于本会话） }
      responses:
        '201':
          description: 已追加
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/NoteBlock'
                  - $ref: '#/components/schemas/Envelope'
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
