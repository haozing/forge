            schema:
              type: object
              required: [workspace_id, query]
              properties:
                workspace_id: { type: string, format: uuid }
                query: { type: string, maxLength: 10000 }
                history:
                  type: array
                  maxItems: 20
                  items:
                    type: object
                    required: [role, content]
                    properties:
                      role: { type: string, enum: [user, assistant] }
