        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/TagId'
      responses:
        '200':
          description: 标签详情（含 ETag）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Tag'
