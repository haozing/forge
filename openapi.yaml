      description: 标签 facet 计数（COUNT(DISTINCT asset_id)）；未知 key → 422 unknown_tag，矛盾组合 → 422 contradictory_tag_filter
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - name: scope
          in: query
          schema:
            type: string
            enum: [working, published]
            default: working
        - name: resource_model_id
          in: query
          schema: { type: string, format: uuid }
        - name: visibility
          in: query
          schema: { type: string }
        - name: publication_status
          in: query
          schema: { type: string }
        - name: tags_any
          in: query
          description: 可重复的 query 参数（normalized key）
          schema:
            type: array
            items: { type: string }
          style: form
          explode: true
        - name: tags_all
          in: query
          schema:
            type: array
            items: { type: string }
          style: form
          explode: true
        - name: tags_none
          in: query
          schema:
            type: array
            items: { type: string }
          style: form
          explode: true
        - name: tag_status
          in: query
          schema:
            type: string
            enum: [active, archived]
            default: active
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: facet 计数（按计数降序）
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/TagFacet' }
                      page: { $ref: '#/components/schemas/CursorPage' }
                  - $ref: '#/components/schemas/Envelope'
        '422': { $ref: '#/components/responses/Error' }
  /api/open/hooks/assets:
    post:
      tags: [tags]
      operationId: createWebhookAsset
      description: |
        Webhook 资产推送（Open API Key 认证）。tag_keys 只能引用同 workspace 已有 active 标签，
        unknown/archived key 整个请求 422（unknown_tag / tag_archived）；请求含旧 tags 字段返回
        422 legacy_tags_field_not_supported。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                source: { type: string, enum: [webhook] }
                external_ref: { type: string, minLength: 16, maxLength: 200 }
                workspace_id: { type: string, format: uuid }
                resource_model_id: { type: string, format: uuid }
                title: { type: string, nullable: true }
                markdown: { type: string, nullable: true }
                fields: { type: object, additionalProperties: true }
                tag_keys:
                  type: array
                  maxItems: 100
                  items: { type: string }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      asset: { $ref: '#/components/schemas/Asset' }
                      resource_model_id: { type: string, format: uuid }
                      workspace_id: { type: string, format: uuid }
                      external_ref: { type: string }
                      received_at: { type: string, format: date-time }
                      replayed: { type: boolean }
                  - $ref: '#/components/schemas/Envelope'
        '200':
          description: external_ref 重放
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      asset: { $ref: '#/components/schemas/Asset' }
                      replayed: { type: boolean }
                  - $ref: '#/components/schemas/Envelope'
        '422': { $ref: '#/components/responses/Error' }
