        asset_id: { type: string, format: uuid }
        version_no: { type: integer }
        origin:
          type: string
          enum: [human, imported, ai_generated, ai_assisted]
        confirmation_status:
          type: string
          enum: [unconfirmed, human_confirmed]
        title: { type: string }
        summary: { type: string }
        markdown: { type: string }
        fields: { type: object, additionalProperties: true }
        parent_version_id: { type: string, format: uuid, nullable: true }
        content_checksum: { type: string }
        created_at: { type: string, format: date-time }
    SessionInfo:
      type: object
      properties:
        id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        absolute_expires_at: { type: string, format: date-time }
        ip_prefix: { type: string }
        user_agent: { type: string }
        is_current: { type: boolean }
    Profile:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        display_name: { type: string }
        organization_role: { type: string }
        status: { type: string }
        last_login_at: { type: string, format: date-time, nullable: true }
        revision: { type: integer }
        etag: { type: string }
    OrganizationRef:
      type: object
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
    Me:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        display_name: { type: string }
        organization_role: { type: string }
        status: { type: string }
        last_login_at: { type: string, format: date-time, nullable: true }
        revision: { type: integer }
        organization: { $ref: '#/components/schemas/OrganizationRef' }
        allowed_actions:
          type: array
          items: { type: string }
    Preferences:
      type: object
      properties:
        default_workspace_id: { type: string, format: uuid, nullable: true }
        timezone: { type: string }
        email_notifications_enabled: { type: boolean }
        revision: { type: integer }
        updated_at: { type: string, format: date-time }
    PreferencesPatch:
      type: object
      properties:
        default_workspace_id: { type: string, format: uuid, nullable: true }
        timezone: { type: string }
        email_notifications_enabled: { type: boolean }
    ResolvedInvitation:
      type: object
      properties:
        organization_name: { type: string }
        email: { type: string, description: 脱敏邮箱 }
        inviter_display_name: { type: string }
        workspaces:
