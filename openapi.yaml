  /api/open/agent-tasks:
    post:
      tags: [agent-tasks]
      operationId: createAgentTask
      description: Agent 整理任务（开放凭据；多资产 1..20；幂等键；202 返回 run_id）
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent_application_id, operation, input_asset_ids]
              properties:
                agent_application_id: { type: string, format: uuid }
                operation: { type: string, enum: [prepare_asset] }
                input_asset_ids:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items: { type: string, format: uuid }
      responses:
        '202':
          description: 任务已受理
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      task_id: { type: string }
                      run_id: { type: string }
                  - $ref: '#/components/schemas/Envelope'
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/open/agent-tasks/{taskId}:
    get:
      tags: [agent-tasks]
      operationId: getAgentTask
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 任务详情
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                  - $ref: '#/components/schemas/Envelope'
        '404': { $ref: '#/components/responses/Error' }
  /api/open/assets:
    post:
      tags: [open]
      operationId: createOpenAsset
      summary: Create an asset with agent credentials
      description: Agent 直接建资产（asset.create 能力；幂等键；201 返回资产）
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resource_model_id, workspace_id]
              properties:
                resource_model_id: { type: string, format: uuid }
                workspace_id: { type: string, format: uuid }
                title: { type: string, nullable: true }
                markdown: { type: string, nullable: true }
                fields: { type: object, additionalProperties: true }
                source: { type: object, additionalProperties: true }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Asset'
