                      error: { type: string, nullable: true }
                  - $ref: '#/components/schemas/Envelope'
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/model-endpoints/{endpointId}/enable:
    post:
      tags: [model-endpoints]
      operationId: enableModelEndpoint
      summary: Enable a model endpoint
      parameters:
        - name: endpointId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 已启用
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ModelEndpoint'
                  - $ref: '#/components/schemas/Envelope'
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/model-endpoints/{endpointId}/disable:
    post:
      tags: [model-endpoints]
      operationId: disableModelEndpoint
      summary: Disable a model endpoint
      parameters:
        - name: endpointId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 已停用
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ModelEndpoint'
                  - $ref: '#/components/schemas/Envelope'
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/admin/agent-users:
    post:
      tags: [admin]
      operationId: registerAgentUser
      summary: Register an agent user with application and API key
      description: 注册 Agent 身份（agent.manage 能力；返回一次性 api_key，no-store）
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [display_name, api_key_name, application_name, model_endpoint_id, runtime_mode]
              properties:
                display_name: { type: string }
                api_key_name: { type: string }
                application_name: { type: string }
                model_endpoint_id: { type: string, format: uuid }
                runtime_mode: { type: string, enum: [chat, react] }
                workflow_key: { type: string }
                capabilities:
                  type: array
                  items: { type: string }
                answer_posture: { type: string }
                expires_at: { type: string, format: date-time, nullable: true }
      responses:
        '201':
          description: 已注册（api_key 仅此一次返回）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AgentApplication'
                  - $ref: '#/components/schemas/Envelope'
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/admin/agent-users/{agentUserId}/onboarding:
    get:
      tags: [admin]
      operationId: getAgentUserOnboarding
      summary: Get agent user onboarding state
      parameters:
        - name: agentUserId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 引导状态
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      agent_user_id: { type: string, format: uuid }
                      display_name: { type: string }
                      applications:
                        type: array
                        items: { $ref: '#/components/schemas/AgentApplication' }
                      api_keys:
                        type: array
                        items:
                          type: object
                          properties:
                            name: { type: string }
                            prefix: { type: string }
                            created_at: { type: string, format: date-time }
                      policies:
                        type: array
                        items:
                          type: object
                          properties:
                            resource_model_id: { type: string, format: uuid }
                            actions:
                              type: array
                              items: { type: string }
                  - $ref: '#/components/schemas/Envelope'
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/admin/agent-users/{agentUserId}/access-policy:
    put:
      tags: [admin]
      operationId: replaceAgentAccessPolicy
      summary: Replace the model access policy of an agent user
      parameters:
        - name: agentUserId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resource_model_id, actions, data_scope]
              properties:
                resource_model_id: { type: string, format: uuid }
                actions:
                  type: array
                  items: { type: string }
                data_scope: { type: string }
      responses:
        '200':
          description: 已替换
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      agent_user_id: { type: string, format: uuid }
                      resource_model_id: { type: string, format: uuid }
                      actions:
                        type: array
                        items: { type: string }
                      data_scope: { type: string }
                  - $ref: '#/components/schemas/Envelope'
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/admin/agent-users/{agentUserId}/api-keys/rotate:
    post:
      tags: [admin]
      operationId: rotateAgentAPIKey
      summary: Rotate the API key of an agent user
      description: 轮换 API key（返回一次性新 key，no-store）
      parameters:
        - name: agentUserId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                expires_at: { type: string, format: date-time, nullable: true }
      responses:
        '200':
          description: 已轮换（新 key 仅此一次返回）
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      agent_user_id: { type: string, format: uuid }
                      api_key: { type: string }
                      api_key_prefix: { type: string }
                      expires_at: { type: string, format: date-time, nullable: true }
                  - $ref: '#/components/schemas/Envelope'
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/admin/agent-users/{agentUserId}/api-keys/revoke-all:
    post:
      tags: [admin]
      operationId: revokeAllAgentAPIKeys
      summary: Revoke every API key of an agent user
      parameters:
        - name: agentUserId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: 已全部吊销
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/admin/agent-applications:
    get:
      tags: [admin]
      operationId: adminListAgentApplications
      summary: List all agent applications (operator view)
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
      responses:
        '200':
          description: 全量应用列表
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/AgentApplication' }
                  - $ref: '#/components/schemas/Envelope'
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/admin/agent-applications/{applicationId}:
    get:
      tags: [admin]
      operationId: adminGetAgentApplication
      summary: Get an agent application (operator view)
      parameters:
        - name: applicationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 应用详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AgentApplication'
                  - $ref: '#/components/schemas/Envelope'
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/admin/agent-applications/{applicationId}/status:
    patch:
      tags: [admin]
      operationId: adminSetAgentApplicationStatus
      summary: Set agent application status (operator)
      parameters:
        - name: applicationId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [active, disabled] }
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AgentApplication'
                  - $ref: '#/components/schemas/Envelope'
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
components:
  schemas:
    ConversationList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ConversationSummary' }
        has_more: { type: boolean }
        next_cursor: { type: string }
    ConversationSummary:
      type: object
      properties:
        conversation_id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
        title: { type: string }
        source: { type: string, enum: [chat_interface, document, asset, automation] }
        visibility: { type: string, enum: [workspace, organization, public] }
        status: { type: string, enum: [active, completed, archived, failed] }
        card_status: { type: string, enum: [organizing, reviewing, rejected, published, pending_update], description: 灵感卡五态徽标（整理中/审核中/未通过/已入库/待入库），由发布状态推导 }
        card_status_detail: { type: string, description: 未通过时的驳回意见 }
        has_new_changes: { type: boolean, description: 审核中角标：送审后笔记又有改动 }
        container_id: { type: string, format: uuid }
        note_asset_id: { type: string }
        note_first_line: { type: string, description: 笔记首行摘要（树中第一个块的内容截断） }
        parent_conversation_id: { type: string, description: 来源思考 ID，根思考为空字符串 }
        origin_derivation_id: { type: string, description: 产生本思考的派生记录 ID，根思考为空字符串 }
        last_message_preview: { type: string }
        message_count: { type: integer }
        updated_at: { type: string, format: date-time }
    ConversationCreate:
      type: object
      required: [agent_application_id, title, source, visibility]
      properties:
        agent_application_id: { type: string, format: uuid }
        title: { type: string }
        source: { type: string, enum: [chat_interface, document, asset, automation] }
        visibility: { type: string, enum: [workspace, organization, public] }
        container_id: { type: string, format: uuid }
    ConversationResult:
      type: object
      properties:
        conversation_id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
        container_id: { type: string, format: uuid }
        note_asset_id: { type: string, format: uuid }
        agent_application_id: { type: string, format: uuid }
        bound_agent_user_id: { type: string, format: uuid }
        status: { type: string }
    Conversation:
      allOf:
        - $ref: '#/components/schemas/ConversationResult'
        - type: object
          properties:
            title: { type: string }
            source: { type: string, enum: [chat_interface, document, asset, automation] }
            visibility: { type: string, enum: [workspace, organization, public] }
            parent_conversation_id: { type: string, description: 来源思考 ID，根思考为空字符串 }
            origin_derivation_id: { type: string, description: 产生本思考的派生记录 ID，根思考为空字符串 }
            created_at: { type: string }
            updated_at: { type: string }
    ConversationPatch:
      type: object
      properties:
        title: { type: string }
        visibility: { type: string, enum: [workspace, organization, public] }
    ConversationDeleteResult:
      type: object
      properties:
        conversation_id: { type: string, format: uuid }
        deleted_children:
          type: array
          description: 级联删除的派生思考 ID；未级联时为空数组
          items: { type: string, format: uuid }
    Message:
      type: object
      properties:
        block_revision_id: { type: string, format: uuid }
        block_id: { type: string, format: uuid }
        conversation_id: { type: string, format: uuid }
        role: { type: string, enum: [user, assistant, system, tool, transcription] }
        content: { type: string }
        content_format: { type: string }
        status: { type: string, enum: [pending, completed, failed, cancelled] }
        provider_conversation_id: { type: string }
        provider_message_id: { type: string }
        sequence_no: { type: integer }
        created_at: { type: string }
        references:
          type: array
          items: { type: object }
    MessageAppend:
      type: object
      required: [role, content, content_format, status]
      properties:
        role: { type: string, enum: [user, assistant, system, tool, transcription] }
        content: { type: string }
        content_format: { type: string }
        provider_conversation_id: { type: string, nullable: true }
        provider_message_id: { type: string, nullable: true }
        status: { type: string, enum: [pending, completed, failed, cancelled] }
        reply_to_block_id: { type: string, format: uuid, nullable: true }
    MessageAppendResult:
      type: object
      properties:
        block_revision_id: { type: string, format: uuid }
        block_id: { type: string, format: uuid }
        conversation_id: { type: string, format: uuid }
        sequence_no: { type: integer }
        role: { type: string }
        status: { type: string }
    ChatRequest:
      type: object
      required: [query]
      properties:
        query: { type: string }
        response_mode:
          type: string
          enum: [answer, answer_with_sources]
          description: answer 跟随应用默认回答姿态；answer_with_sources 强制问答姿态；draft_note 规划中
        reference_ids:
          type: array
          items: { type: string, format: uuid }
        model_context: { type: object }
        response_mode: { type: string, enum: [answer, answer_with_sources, draft_note] }
    ChatResult:
      type: object
      properties:
        answer: { type: string }
        grounded:
          type: boolean
          description: true=问答姿态（依据已发布资产并引用）；false=共创姿态（草稿性质，references 恒空）
        conversation_id: { type: string, format: uuid }
        message_id: { type: string, format: uuid }
        references:
          type: array
          items:
            type: object
            properties:
              asset_id: { type: string, format: uuid }
              asset_version_id: { type: string, format: uuid }
              title: { type: string }
              snippet: { type: string }
        rejected_reference_count: { type: integer }
        usage:
          type: object
          properties:
            input_tokens: { type: integer }
            output_tokens: { type: integer }
    NoteView:
      type: object
      description: 会话笔记视图。块树是唯一事实源；markdown 是冻结产物（每个版本一份），draft_markdown 是活树实时渲染（只读投影）
      properties:
        conversation_id: { type: string, format: uuid }
        note_asset_id: { type: string, format: uuid }
        container_id: { type: string, format: uuid, description: 笔记文档容器（活块树） }
        asset_version_id: { type: string, description: 当前工作版本，无则为空字符串 }
        title: { type: string, nullable: true }
        markdown: { type: string, nullable: true, description: 当前工作版本的冻结 markdown }
        fields: { type: object }
        revision: { type: integer, description: 活树修订（提交乐观锁 draft_revision） }
        committed_revision: { type: integer, description: 最近一次固化的树修订 }
        draft_markdown: { type: string, description: 活树实时渲染，只读 }
        dirty: { type: boolean, description: 活树较最近固化有变化 }
        publication_status: { type: string }
        confirmation_status: { type: string, enum: [unconfirmed, human_confirmed, ''] }
        message_count: { type: integer }
    NoteBlock:
      type: object
      properties:
        block_id: { type: string, format: uuid }
        block_revision_id: { type: string, format: uuid }
        position: { type: number }
        kind: { type: string, description: paragraph/heading/quote/code/list/callout（笔记树只含手动块与收录的消息摘录；会话消息不在树中） }
        content: { type: string }
        editable: { type: boolean }
    Derivation:
      type: object
      properties:
        derivation_id: { type: string, format: uuid }
        source_conversation_id: { type: string, format: uuid }
        target_conversation_id: { type: string, format: uuid }
        target_note_asset_id: { type: string, format: uuid }
        operation: { type: string, enum: [create_chat, link, merge] }
        context_policy: { type: string, enum: [summary_only, selected_only, full], description: 决定注入派生会话笔记开场引用块的内容量：摘要(200字/块)/选中原文(2000字/块)/源笔记全文 }
        status: { type: string, enum: [requested, discussing, result_ready, finalizing, completed, failed, cancelled] }
        created_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time, description: 未完成时为空字符串 }
        sources:
          type: array
          description: 选中源块明细（GET 详情返回）；选块范围为源笔记树（手动块与收录摘录）
          items: { $ref: '#/components/schemas/DerivationSource' }
    DerivationSource:
      type: object
      properties:
        ordinal: { type: integer }
        origin: { type: string, enum: [note], description: 源笔记块 }
        source_container_id: { type: string, format: uuid }
        source_block_revision_id: { type: string, format: uuid }
        source_excerpt: { type: string }
        context_role: { type: string, enum: [selected, adjacent, summary] }
    DerivationCreate:
      type: object
      required: [source_block_revision_ids, context_policy, title]
      properties:
        source_block_revision_ids:
          type: array
          items: { type: string, format: uuid }
          minItems: 1
          maxItems: 50
          description: 可选范围=笔记文档活树中的块（消息块与手动块；GET /note/blocks 获取）
        context_policy: { type: string, enum: [summary_only, selected_only, full] }
        title: { type: string }
    DerivationFinalize:
      type: object
      required: [disposition]
      properties:
        disposition: { type: string, enum: [independent, reference, merge] }
        target_asset_id: { type: string, format: uuid, nullable: true }
        expected_source_asset_version_id: { type: string, format: uuid, nullable: true }
        expected_target_asset_version_id: { type: string, format: uuid, nullable: true }
        merge_mode: { type: string }
        auto_archive: { type: boolean, nullable: true, description: 收割成功后归档派生会话（默认 true） }
    DerivationFinalizeResult:
      type: object
      properties:
        derivation_id: { type: string, format: uuid }
        disposition: { type: string }
        asset_id: { type: string, format: uuid }
        asset_version_id: { type: string, format: uuid }
        relation_id: { type: string, format: uuid }
        status: { type: string }
    MediaRegister:
      type: object
      required: [attachment_id, media_kind]
      properties:
        attachment_id: { type: string, format: uuid }
        media_kind: { type: string, enum: [audio, video] }
        language: { type: string }
        duration_ms: { type: integer, nullable: true }
    MediaResult:
      type: object
      properties:
        media_id: { type: string, format: uuid }
        conversation_id: { type: string, format: uuid }
        attachment_id: { type: string, format: uuid }
        media_kind: { type: string }
        status: { type: string }
        language: { type: string }
        duration_ms: { type: integer }
        transcription_job_id: { type: string }
    PublicSite:
      type: object
      properties:
        id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        domain: { type: string }
        template: { type: string, enum: [blog, pro] }
        default_content_scope: { type: string, enum: [public, organization, workspace] }
        homepage_config: { type: object }
        navigation_config: { type: object }
        status: { type: string, enum: [active, disabled] }
        revision: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SiteCreate:
      type: object
      required: [slug, name]
      properties:
        slug: { type: string, pattern: '^[a-z0-9][a-z0-9-]{1,62}[a-z0-9]$' }
        name: { type: string, maxLength: 200 }
        domain: { type: string }
        template: { type: string, enum: [blog, pro] }
        default_content_scope: { type: string, enum: [public, organization, workspace] }
        homepage_config: { type: object }
        navigation_config: { type: object }
    SitePatch:
      type: object
      properties:
        name: { type: string, maxLength: 200 }
        domain: { type: string }
        template: { type: string, enum: [blog, pro] }
        default_content_scope: { type: string, enum: [public, organization, workspace] }
        homepage_config: { type: object }
        navigation_config: { type: object }
        status: { type: string, enum: [active, disabled] }
    SiteBinding:
      type: object
      properties:
        id: { type: string, format: uuid }
        site_id: { type: string, format: uuid }
        asset_id: { type: string, format: uuid }
        display_path: { type: string }
        content_type: { type: string, enum: [article, featured, about] }
        section_slug: { type: string }
        sort_order: { type: integer }
        on_homepage: { type: boolean }
        on_navigation: { type: boolean }
        display_config: { type: object }
        display_published_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    BindingCreate:
      type: object
      required: [asset_id, display_path]
      properties:
        asset_id: { type: string, format: uuid }
        display_path: { type: string, pattern: '^[a-z0-9][a-z0-9/-]{0,120}[a-z0-9]$' }
        content_type: { type: string, enum: [article, featured, about] }
        section_slug: { type: string }
        sort_order: { type: integer }
        on_homepage: { type: boolean }
        on_navigation: { type: boolean }
        display_config: { type: object }
    BindingPatch:
      type: object
      properties:
        display_path: { type: string }
        content_type: { type: string, enum: [article, featured, about] }
        section_slug: { type: string }
        sort_order: { type: integer }
        on_homepage: { type: boolean }
        on_navigation: { type: boolean }
