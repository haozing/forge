        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query: { type: string, maxLength: 10000 }
                conversation_id: { type: string, maxLength: 200 }
                response_mode: { type: string, enum: [answer, answer_with_sources] }
      responses:
        '200':
          description: text/event-stream
          content:
            text/event-stream:
              schema: { type: string }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/agent-sessions/{sessionId}/references/validate:
    post:
      tags: [agent-sessions]
      operationId: validateAgentSessionReferences
      summary: Validate asset references for a session
      description: 校验 1..50 条 asset+version 引用（会话绑定的 agent 身份执行 asset.read）
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [references]
              properties:
                references:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    type: object
                    required: [asset_id, asset_version_id]
                    properties:
                      asset_id: { type: string, format: uuid }
                      asset_version_id: { type: string, format: uuid }
      responses:
        '200':
          description: 校验结果
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      references:
                        type: array
                        items: { $ref: '#/components/schemas/ValidatedReference' }
                      rejected_count: { type: integer }
                  - $ref: '#/components/schemas/Envelope'
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/agent-sessions/{sessionId}/runs:
    post:
      tags: [agent-runs]
      operationId: createAgentSessionRun
      summary: Start a react-mode run on a session
      description: 在活跃会话上创建 react 运行（202 受理；workspace 必须启用该应用）
      parameters:
        - name: sessionId
          in: path
