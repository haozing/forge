        '200':
          description: 已重命名
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Tag'
                  - $ref: '#/components/schemas/Envelope'
        '412': { $ref: '#/components/responses/Error' }
