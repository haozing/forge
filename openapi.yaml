      responses:
        '200': { description: 预设列表, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
    post:
      tags: [sites]
      operationId: createOrgStylePreset
      description: 另存为组织预设（style_config 必须锚定内置 preset；custom_css 经白名单清理）
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                style_config: { type: object }
                custom_css: { type: string }
      responses:
        '201': { description: 已保存, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
        '422': { description: 文档非法（validation_failed） }
  /api/organization/style-presets/{presetId}:
    delete:
      tags: [sites]
