openapi: 3.0.3
info:
  title: AgentChunzhi API
  version: 2.1.0
  description: |
    唯一权威契约（与 router_groups.go 双向对照测试锁定）。路由为单一无版本树，入口族：
    - /api/... 成员会话和工作区管理 API
    - /api/open/... Agent 和外部系统 API Key API
    - /api/public/... 匿名或站点访问 API
    2026-08-31 开发期清理：退役 /api/v2、/api/public/v2、/api/open/v1|v2、/api/frontend 全部
    前缀（404，无重定向），openapi-v2.yaml 更名为 openapi.yaml（见 docs/route-retirement-ledger.md）。
    阶段 0 冻结全局组件与核心资源名；未实现的领域只冻结资源命名，不注册假 handler。
    阶段 1 增补 sessions、me、preferences、password-resets、organization 与 workspace 治理/成员/邀请路径。
    阶段 2 增补 tags、tag-facets 与 /api/open/hooks/assets（tag_keys）；AssetDraft 支持 tag_ids。
    阶段 3 增补统一查询（成员工作区/组织/OpenAPI query、citation validate）、投影运维
    （profiles/activate、workspace/organization retrieval status 与 rebuilds）与查询执行审计
    （query-executions）。
    阶段 4 增补建议流：prepare（成员发起 Agent 整理，202 返回 run_id）、三类建议联合列表、
    accept/reject/accept-batch 与 processing-results；建议只进共享 AssetDraft，版本在用户 commit 时产生
    （origin=ai_assisted），发布审计带 Agent 溯源六要素（见 docs/route-retirement-ledger.md 阶段 4 行）。
servers:
  - url: /
tags:
  - name: publication-requests
  - name: assets
  - name: suggestions
  - name: identity
  - name: workspaces
  - name: tags
  - name: query
  - name: sites
paths:
  /api/workspaces/{workspaceId}/publication-requests:
    get:
      tags: [publication-requests]
      operationId: listPublicationRequests
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/PublicationRequestStatus'
      responses:
        '200':
          description: 审核队列
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PublicationRequestListData'
                  - $ref: '#/components/schemas/Envelope'
    post:
      tags: [publication-requests]
      operationId: submitPublicationRequest
      description: 为资产当前 working version 提交发布审批
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [asset_id, draft_revision]
              properties:
                asset_id:
                  type: string
                  format: uuid
                draft_revision:
                  type: integer
                comment:
                  type: string
                scheduled_at:
                  type: string
                  format: date-time
                  description: 可选的未来时刻；批准后在到点由 worker 执行发布（定时发布 G4）
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PublicationRequest'
                  - $ref: '#/components/schemas/Envelope'
  /api/workspaces/{workspaceId}/publication-requests/{requestId}:
    get:
      tags: [publication-requests]
      operationId: getPublicationRequest
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - name: requestId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 审核详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PublicationRequest'
                  - $ref: '#/components/schemas/Envelope'
    delete:
      tags: [publication-requests]
      operationId: cancelPublicationRequest
      description: 提交者取消自己的 pending 请求
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - name: requestId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 已取消
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PublicationRequest'
                  - $ref: '#/components/schemas/Envelope'
        '409': { $ref: '#/components/responses/Error' }
  /api/workspaces/{workspaceId}/publication-requests/{requestId}/approve:
    post:
      tags: [publication-requests]
      operationId: approvePublicationRequest
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - name: requestId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                comment: { type: string }
      responses:
        '200':
          description: 已批准并发布
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PublicationRequest'
                  - $ref: '#/components/schemas/Envelope'
  /api/workspaces/{workspaceId}/publication-requests/{requestId}/reject:
    post:
      tags: [publication-requests]
      operationId: rejectPublicationRequest
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - name: requestId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [comment]
              properties:
                comment: { type: string }
      responses:
        '200':
          description: 已拒绝
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PublicationRequest'
                  - $ref: '#/components/schemas/Envelope'
  /api/workspaces/{workspaceId}/publication-requests/{requestId}/cancel:
    post:
      tags: [publication-requests]
      operationId: cancelPublicationRequest
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - name: requestId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        '200':
          description: 已取消
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PublicationRequest'
                  - $ref: '#/components/schemas/Envelope'
  /api/workspaces/{workspaceId}/publication-requests/{requestId}/comments:
    get:
      tags: [publication-requests]
      operationId: listPublicationComments
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - name: requestId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 评论列表（keyset 分页）
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/PublicationComment' } }
                      next_cursor: { type: string }
                      has_more: { type: boolean }
                  - $ref: '#/components/schemas/Envelope'
        '404': { $ref: '#/components/responses/Error' }
    post:
      tags: [publication-requests]
      operationId: createPublicationComment
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - name: requestId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string }
      responses:
        '201':
          description: 评论已创建
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PublicationComment'
                  - $ref: '#/components/schemas/Envelope'
  /api/workspaces/{workspaceId}/publication-requests/batch:
    post:
      tags: [publication-requests]
      operationId: batchPublicationRequests
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, items]
              properties:
                decision:
                  type: string
                  enum: [approve, reject]
                items:
                  type: array
                  maxItems: 100
                  items:
                    type: object
                    required: [request_id]
                    properties:
                      request_id: { type: string, format: uuid }
                      comment: { type: string }
      responses:
        '200':
          description: 批量结果（逐项）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PublicationBatchResult'
                  - $ref: '#/components/schemas/Envelope'
  /api/assets/{assetId}/draft:
    get:
      tags: [assets]
      operationId: getAssetDraft
      description: 读取当前 AssetDraft（含标签 summaries）；响应含 ETag，作为后续 PATCH If-Match 基线
      parameters:
        - $ref: '#/components/parameters/AssetId'
      responses:
        '200':
          description: 当前草稿
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AssetDraft'
                  - $ref: '#/components/schemas/Envelope'
    patch:
      tags: [assets]
      operationId: autosaveAssetDraft
      description: AssetDraft 自动保存；If-Match 携带 draft revision；tag_ids 省略表示保留，传数组（可空）表示整组替换
      parameters:
        - $ref: '#/components/parameters/AssetId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetDraftPatch'
      responses:
        '200':
          description: 已保存（返回 draft 与当前标签 summaries）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AssetDraft'
                  - $ref: '#/components/schemas/Envelope'
  /api/assets/{assetId}/commit-draft:
    post:
      tags: [assets]
      operationId: commitAssetDraft
      parameters:
        - $ref: '#/components/parameters/AssetId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [draft_revision]
              properties:
                draft_revision: { type: integer }
      responses:
        '201':
          description: 新版本已创建
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AssetVersion'
                  - $ref: '#/components/schemas/Envelope'
  /api/assets/{assetId}/publish:
    post:
      tags: [assets]
      operationId: publishAsset
      parameters:
        - $ref: '#/components/parameters/AssetId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                draft_revision: { type: integer }
                scheduled_at:
                  type: string
                  format: date-time
                  description: 可选的未来时刻（direct 模式）；登记定时发布意图而非立即切指针（G4）
      responses:
        '200':
          description: 已发布
        '202':
          description: 已登记定时发布意图（direct 模式 + scheduled_at）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Asset'
                  - $ref: '#/components/schemas/Envelope'
  /api/assets/{assetId}/archive:
    post:
      tags: [assets]
      operationId: archiveAsset
      parameters:
        - $ref: '#/components/parameters/AssetId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 已归档
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Asset'
                  - $ref: '#/components/schemas/Envelope'
  /api/assets/{assetId}/restore:
    post:
      tags: [assets]
      operationId: restoreAsset
      parameters:
        - $ref: '#/components/parameters/AssetId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 已恢复为草稿
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Asset'
                  - $ref: '#/components/schemas/Envelope'
  /api/asset-versions/{versionId}/confirm:
    post:
      tags: [assets]
      operationId: confirmAssetVersion
      description: 人工确认：创建内容相同的派生版本并写入 human_confirmed
      parameters:
        - name: versionId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: 派生版本已创建
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AssetVersion'
                  - $ref: '#/components/schemas/Envelope'
  /api/workspaces/{workspaceId}/assets:
    get:
      tags: [assets]
      operationId: listWorkspaceAssets
      summary: List workspace assets
      description: 工作区资产集合（游标分页；q 过滤走 query 域）
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 资产列表
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Asset' }
                  - $ref: '#/components/schemas/CursorPage'
                  - $ref: '#/components/schemas/Envelope'
    post:
      tags: [assets]
      operationId: createWorkspaceAsset
      summary: Create a workspace asset
      description: 在工作区创建资产（直接落库，非草稿流；member 写面禁用字符串 tags 字段）
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resource_model_id]
              properties:
                resource_model_id: { type: string, format: uuid }
                visibility: { type: string }
                title: { type: string, nullable: true }
                summary: { type: string, nullable: true }
                markdown: { type: string, nullable: true }
                fields: { type: object, additionalProperties: true }
                source: { type: object, additionalProperties: true }
                container_ids:
                  type: array
                  items: { type: string, format: uuid }
                parent_asset_id: { type: string, format: uuid, nullable: true }
      responses:
        '201':
          description: 已创建（ETag 头返回版本校验和）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Asset'
                  - $ref: '#/components/schemas/Envelope'
        '422': { $ref: '#/components/responses/Error' }
  /api/assets/{assetId}/source-conversation:
    get:
      tags: [assets]
      operationId: getAssetSourceConversation
      description: 知识库详情页的"来自灵感卡"回链（仅作者可解析）：返回孕育该资产的会话。灵感卡删除（binding 消失）后 404。
      parameters:
        - $ref: '#/components/parameters/AssetId'
      responses:
        '200':
          description: 灵感卡 ID
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      conversation_id: { type: string, format: uuid }
                  - $ref: '#/components/schemas/Envelope'
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/assets/{assetId}:
    get:
      tags: [assets]
      operationId: getAsset
      summary: Get asset detail
      parameters:
        - $ref: '#/components/parameters/AssetId'
      responses:
        '200':
          description: 资产详情（ETag 头返回版本校验和）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Asset'
                  - $ref: '#/components/schemas/Envelope'
        '404': { $ref: '#/components/responses/Error' }
    patch:
      tags: [assets]
      operationId: patchAsset
      summary: Patch asset metadata
      description: 覆盖式更新资产元数据（需 If-Match 与 Idempotency-Key）
      parameters:
        - $ref: '#/components/parameters/AssetId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, nullable: true }
                summary: { type: string, nullable: true }
                markdown: { type: string, nullable: true }
                fields: { type: object, additionalProperties: true, nullable: true }
                visibility: { type: string, nullable: true }
                source: { type: object, additionalProperties: true, nullable: true }
                container_ids:
                  type: array
                  items: { type: string, format: uuid }
                  nullable: true
                parent_asset_id: { type: string, format: uuid, nullable: true }
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Asset'
                  - $ref: '#/components/schemas/Envelope'
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    delete:
      tags: [assets]
      operationId: deleteAsset
      summary: Archive asset via DELETE
      description: 软删除（归档）资产
      parameters:
        - $ref: '#/components/parameters/AssetId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: 已归档
        '404': { $ref: '#/components/responses/Error' }
  /api/assets/{assetId}/duplicate:
    post:
      tags: [assets]
      operationId: duplicateAsset
      summary: Duplicate an asset
      description: 复制资产内容并在副本首个版本记录 duplicate 关系
      parameters:
        - $ref: '#/components/parameters/AssetId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: 副本已创建
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Asset'
                  - $ref: '#/components/schemas/Envelope'
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/assets/{assetId}/lineage:
    get:
      tags: [assets]
      operationId: getAssetLineage
      summary: Get asset lineage
      description: 资产血缘：版本历史、原始输入与加工链
      parameters:
        - $ref: '#/components/parameters/AssetId'
      responses:
        '200':
          description: 血缘视图
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/AssetVersion' }
                  - $ref: '#/components/schemas/Envelope'
        '404': { $ref: '#/components/responses/Error' }
  /api/assets/{assetId}/relations:
    get:
      tags: [assets]
      operationId: getAssetRelations
      summary: Get asset relations
      description: 资产关系边（duplicate/derivation/container 等关系类型）
      parameters:
        - $ref: '#/components/parameters/AssetId'
      responses:
        '200':
          description: 关系列表
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            relation_type: { type: string }
                            target_asset_id: { type: string, format: uuid }
                            source_asset_id: { type: string, format: uuid }
                            source: { type: string }
                  - $ref: '#/components/schemas/Envelope'
        '404': { $ref: '#/components/responses/Error' }
  /api/assets/{assetId}/versions:
    get:
      tags: [assets]
      operationId: listAssetVersions
      summary: List asset versions
      parameters:
        - $ref: '#/components/parameters/AssetId'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 版本列表
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/AssetVersion' }
                  - $ref: '#/components/schemas/Envelope'
        '404': { $ref: '#/components/responses/Error' }
  /api/asset-versions/{versionId}:
    get:
      tags: [assets]
      operationId: getAssetVersion
      summary: Get asset version detail
      parameters:
        - name: versionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 版本详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AssetVersion'
                  - $ref: '#/components/schemas/Envelope'
        '404': { $ref: '#/components/responses/Error' }
  /api/asset-versions/{versionId}/attachments:
    get:
      tags: [attachments]
      operationId: listAssetVersionAttachments
      summary: List attachments registered on a version
      parameters:
        - name: versionId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 附件列表
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Attachment' }
                  - $ref: '#/components/schemas/Envelope'
        '404': { $ref: '#/components/responses/Error' }
  /api/asset-versions/{versionId}/processing:
    get:
      tags: [assets]
      operationId: getAssetVersionProcessing
      summary: Get processing jobs of a version
      description: 版本加工链（processing jobs）只读视图
      parameters:
        - name: versionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 加工任务列表
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            job_id: { type: string, format: uuid }
                            status: { type: string }
                            started_at: { type: string, format: date-time, nullable: true }
                            finished_at: { type: string, format: date-time, nullable: true }
                  - $ref: '#/components/schemas/Envelope'
        '404': { $ref: '#/components/responses/Error' }
  /api/workspaces/{workspaceId}/attachments:
    post:
      tags: [attachments]
      operationId: uploadAttachment
      summary: Upload an attachment (multipart)
      description: multipart 上传附件（单个 file part；大小上限由服务配置决定）
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: 已上传
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Attachment'
                  - $ref: '#/components/schemas/Envelope'
        '422': { $ref: '#/components/responses/Error' }
  /api/attachments/{attachmentId}:
    get:
      tags: [attachments]
      operationId: getAttachment
      summary: Get attachment detail
      parameters:
        - name: attachmentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 附件详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Attachment'
                  - $ref: '#/components/schemas/Envelope'
        '404': { $ref: '#/components/responses/Error' }
    patch:
      tags: [attachments]
      operationId: patchAttachment
      summary: Rename an attachment
      parameters:
        - name: attachmentId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filename]
              properties:
                filename: { type: string }
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Attachment'
                  - $ref: '#/components/schemas/Envelope'
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    delete:
      tags: [attachments]
      operationId: deleteAttachment
      summary: Delete an attachment
      parameters:
        - name: attachmentId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: 已删除
        '404': { $ref: '#/components/responses/Error' }
  /api/attachments/{attachmentId}/link:
    post:
      tags: [attachments]
      operationId: linkAttachment
      summary: Link an attachment to an asset
      description: 把已上传附件登记为资产的 body/cover 附件
      parameters:
        - name: attachmentId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [asset_id]
              properties:
                asset_id: { type: string, format: uuid }
                role: { type: string, enum: [body, cover] }
      responses:
        '200':
          description: 已登记
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      status: { type: string }
                  - $ref: '#/components/schemas/Envelope'
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/attachments/{attachmentId}/download:
    get:
      tags: [attachments]
      operationId: downloadAttachment
      summary: Download attachment bytes
      parameters:
        - name: attachmentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 附件二进制流
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/Error' }
  /api/attachments/{attachmentId}/presigned-download:
    post:
      tags: [attachments]
      operationId: presignAttachmentDownload
      summary: Issue a short-lived download URL
      description: 换取 10 分钟有效的下载地址（指向 /api/attachments/{attachmentId}/download）
      parameters:
        - name: attachmentId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 下载地址
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      download_url: { type: string }
                      expires_at: { type: string, format: date-time }
                  - $ref: '#/components/schemas/Envelope'
        '404': { $ref: '#/components/responses/Error' }
  /api/workspaces/{workspaceId}/assets/{assetId}/prepare:
    post:
      tags: [suggestions]
      operationId: prepareAsset
      description: 成员发起 Agent 整理：创建 automation.run（source=manual，绑定工作区启用的 asset_prepare
        workflow AgentApplication）；只产出建议集，不产生版本
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/AssetId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: 已受理，返回 run_id；建议经处理结果与建议端点查询
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PrepareAccepted'
                  - $ref: '#/components/schemas/Envelope'
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409':
          description: 工作区没有启用的 asset_prepare AgentApplication（prepare_application_missing）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/workspaces/{workspaceId}/assets/{assetId}/suggestions:
    get:
      tags: [suggestions]
      operationId: listSuggestions
      description: 三类建议（field/summary/tag/relation）联合列表 + 最近处理结果
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/AssetId'
        - $ref: '#/components/parameters/Cursor'
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, accepted, rejected, all]
            default: pending
        - name: run_id
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 建议队列
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuggestionList'
                  - $ref: '#/components/schemas/Envelope'
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/workspaces/{workspaceId}/suggestions/{kind}/{suggestionId}/accept:
    post:
      tags: [suggestions]
      operationId: acceptSuggestion
      description: 采纳单条建议进入共享 AssetDraft（单事务，draft revision 恰 +1）；仅成员可操作
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - name: kind
          in: path
          required: true
          schema:
            type: string
            enum: [field, summary, tag, relation]
        - name: suggestionId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                resolved_tag_id:
                  type: string
                  format: uuid
                  description: tag 建议的显式解析目标（活动工作区标签）；缺省按 suggested_key 解析/创建
      responses:
        '200':
          description: 已采纳；返回建议与进入的 draft
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuggestionReviewOutcome'
                  - $ref: '#/components/schemas/Envelope'
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409':
          description: 建议已被决策（suggestion_state_invalid）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: 建议 kind/目标不合法或合并后字段未过 schema（suggestion_target_invalid）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/workspaces/{workspaceId}/suggestions/{kind}/{suggestionId}/reject:
    post:
      tags: [suggestions]
      operationId: rejectSuggestion
      description: 拒绝单条待定建议（终态，审计保留）
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - name: kind
          in: path
          required: true
          schema:
            type: string
            enum: [field, summary, tag, relation]
        - name: suggestionId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 已拒绝（无正文数据）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409':
          description: 建议已被决策（suggestion_state_invalid）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/workspaces/{workspaceId}/assets/{assetId}/suggestions/accept-batch:
    post:
      tags: [suggestions]
      operationId: batchAcceptSuggestions
      description: 同一事务批量采纳（最多 100 条）；draft 内容合并为一次 autosave，revision 恰 +1
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/AssetId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refs]
              properties:
                refs:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    required: [kind, suggestion_id]
                    properties:
                      kind:
                        type: string
                        enum: [field, summary, tag, relation]
                      suggestion_id: { type: string, format: uuid }
                      resolved_tag_id: { type: string, format: uuid }
      responses:
        '200':
          description: 批量结果：成功项、失败项与共享的 draft revision
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BatchAcceptResponse'
                  - $ref: '#/components/schemas/Envelope'
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/workspaces/{workspaceId}/assets/{assetId}/processing-results:
    get:
      tags: [suggestions]
      operationId: listProcessingResults
      description: 资产的处理结果列表（含建议计数汇总、字段 diff、整体置信度与输出版本回填）
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/AssetId'
      responses:
        '200':
          description: 最近处理结果
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      processing_results:
                        type: array
                        items: { $ref: '#/components/schemas/ProcessingResult' }
                  - $ref: '#/components/schemas/Envelope'
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/public/sessions:
    post:
      tags: [identity]
      operationId: createSession
      description: 匿名邮箱登录。每次尝试消耗 login_email 与 login_ip 限流桶；失败统一 401
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: 登录成功，返回成员摘要并下发会话 cookie
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Me'
                  - $ref: '#/components/schemas/Envelope'
        '401': { $ref: '#/components/responses/Error' }
        '429':
          description: 限流拒绝，携带 Retry-After
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/sessions:
    get:
      tags: [identity]
      operationId: listSessions
      responses:
        '200':
          description: 当前活跃会话列表（is_current 标记当前会话）
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/SessionInfo' }
                      page: { $ref: '#/components/schemas/CursorPage' }
                  - $ref: '#/components/schemas/Envelope'
  /api/sessions/current:
    delete:
      tags: [identity]
      operationId: logout
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204': { description: 已登出并清除 cookie }
        '401': { $ref: '#/components/responses/Error' }
  /api/sessions/{sessionId}:
    delete:
      tags: [identity]
      operationId: revokeSession
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204': { description: 已撤销 }
        '404': { $ref: '#/components/responses/Error' }
  /api/me:
    get:
      tags: [identity]
      operationId: getMe
      responses:
        '200':
          description: 成员资料 + 组织 + allowed_actions
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Me'
                  - $ref: '#/components/schemas/Envelope'
    patch:
      tags: [identity]
      operationId: patchMe
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [display_name]
              properties:
                display_name: { type: string, maxLength: 80 }
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Profile'
                  - $ref: '#/components/schemas/Envelope'
        '412': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
  /api/me/password:
    put:
      tags: [identity]
      operationId: changePassword
      description: 修改密码并撤销除当前会话外的所有会话
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string, minLength: 12, maxLength: 128 }
      responses:
        '200':
          description: 已修改
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      revoked_sessions: { type: integer }
                  - $ref: '#/components/schemas/Envelope'
  /api/me/preferences:
    get:
      tags: [identity]
      operationId: getPreferences
      responses:
        '200':
          description: 偏好（ETag = revision）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Preferences'
                  - $ref: '#/components/schemas/Envelope'
    patch:
      tags: [identity]
      operationId: patchPreferences
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PreferencesPatch' }
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Preferences'
                  - $ref: '#/components/schemas/Envelope'
        '412': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
  /api/public/password-resets:
    post:
      tags: [identity]
      operationId: requestPasswordReset
      description: 恒定 202，不泄露邮箱是否存在
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '202':
          description: 已受理
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      status: { type: string }
                  - $ref: '#/components/schemas/Envelope'
        '429': { $ref: '#/components/responses/Error' }
  /api/public/password-resets/resolve:
    post:
      tags: [identity]
      operationId: resolvePasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '200':
          description: 返回脱敏邮箱
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      email: { type: string }
                  - $ref: '#/components/schemas/Envelope'
        '422': { $ref: '#/components/responses/Error' }
  /api/public/password-resets/complete:
    post:
      tags: [identity]
      operationId: completePasswordReset
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, new_password]
              properties:
                token: { type: string }
                new_password: { type: string, minLength: 12, maxLength: 128 }
      responses:
        '200':
          description: 密码已重置并撤销全部会话
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      status: { type: string }
                  - $ref: '#/components/schemas/Envelope'
        '422': { $ref: '#/components/responses/Error' }
  /api/public/organization-invitations/resolve:
    post:
      tags: [identity]
      operationId: resolveOrganizationInvitation
      description: 匿名解析邀请；只返回展示信息，不泄露内部 ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '200':
          description: 邀请展示信息
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResolvedInvitation'
                  - $ref: '#/components/schemas/Envelope'
        '422': { $ref: '#/components/responses/Error' }
  /api/public/organization-invitations/accept:
    post:
      tags: [identity]
      operationId: acceptOrganizationInvitation
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, display_name, password]
              properties:
                token: { type: string }
                display_name: { type: string, maxLength: 80 }
                password: { type: string, minLength: 12, maxLength: 128 }
      responses:
        '200':
          description: 激活成功并下发会话
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AcceptResult'
                  - $ref: '#/components/schemas/Envelope'
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/organization:
    get:
      tags: [identity]
      operationId: getOrganization
      responses:
        '200':
          description: 组织资料
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Organization'
                  - $ref: '#/components/schemas/Envelope'
    patch:
      tags: [identity]
      operationId: patchOrganization
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 100 }
      responses:
        '200':
          description: 已更新（组织 admin）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Organization'
                  - $ref: '#/components/schemas/Envelope'
        '412': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
  /api/organization/members:
    get:
      tags: [identity]
      operationId: listOrganizationMembers
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 成员目录（组织 admin）
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/OrganizationMember' }
                      page: { $ref: '#/components/schemas/CursorPage' }
                  - $ref: '#/components/schemas/Envelope'
  /api/organization/members/{userId}:
    get:
      tags: [identity]
      operationId: getOrganizationMember
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: 成员详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OrganizationMember'
                  - $ref: '#/components/schemas/Envelope'
    patch:
      tags: [identity]
      operationId: patchOrganizationMember
      description: 单命令补丁：organization_role 或 status
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [organization_role]
                  properties:
                    organization_role: { type: string, enum: [admin, member] }
                - type: object
                  required: [status]
                  properties:
                    status: { type: string, enum: [active, disabled] }
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OrganizationMember'
                  - $ref: '#/components/schemas/Envelope'
        '409': { $ref: '#/components/responses/Error' }
        '412': { $ref: '#/components/responses/Error' }
