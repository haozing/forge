    get:
      tags: [sites]
      operationId: listSiteBindings
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/SiteId'
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, maximum: 100 }
      responses:
        '200':
          description: 绑定列表
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/SiteBinding' } }
                      next_cursor: { type: string }
                      has_more: { type: boolean }
                  - $ref: '#/components/schemas/Envelope'
    post:
      tags: [sites]
      operationId: createSiteBinding
      description: 绑定已发布资产到站点（binding_target_invalid=422 当未发布/越档/通道关闭）
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/SiteId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BindingCreate' }
      responses:
        '201':
          description: 已绑定
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SiteBinding'
                  - $ref: '#/components/schemas/Envelope'
        '409': { description: display_path 冲突, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
        '422': { $ref: '#/components/responses/Error' }
  /api/workspaces/{workspaceId}/sites/{siteId}/bindings/{bindingId}:
    patch:
      tags: [sites]
      operationId: patchSiteBinding
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/SiteId'
        - name: bindingId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BindingPatch' }
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SiteBinding'
                  - $ref: '#/components/schemas/Envelope'
