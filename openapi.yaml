      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - name: q
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema:
            type: string
            enum: [active, archived, all]
            default: active
        - name: sort
          in: query
          schema:
            type: string
            enum: [key:asc, display_name:asc, created_at:desc]
            default: key:asc
        - name: include_usage
          in: query
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
