          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
                display_name: { type: string }
                role: { type: string, enum: [admin, editor, reviewer, viewer] }
                expires_in_hours: { type: integer }
      responses:
        '201':
          description: 已创建，token 仅此一次返回
