  /api/workspaces/{workspaceId}/conversations:
    get:
      tags: [conversations]
      operationId: listConversations
      description: "我的灵感"卡片列表——仅返回当前成员自己发起的会话；每张卡携带五态徽标（card_status）、驳回意见（card_status_detail）、送审期间新改动角标（has_new_changes）与笔记首行摘要（note_first_line）。
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - name: q
          in: query
          schema: { type: string }
        - name: status
          in: query
          description: 按卡片状态筛选 organizing(整理中)/reviewing(审核中)/rejected(未通过)/published(已入库)/pending_update(待入库)
          schema: { type: string, enum: [organizing, reviewing, rejected, published, pending_update] }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: 会话列表（含派生关系与卡片状态字段）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ConversationList'
                  - $ref: '#/components/schemas/Envelope'
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    post:
      tags: [conversations]
      operationId: createConversation
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConversationCreate' }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ConversationResult'
                  - $ref: '#/components/schemas/Envelope'
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/conversations/{conversationId}:
    get:
      tags: [conversations]
      operationId: getConversation
      description: 会话详情；parent_conversation_id/origin_derivation_id 标识派生来源，根思考为空字符串
      parameters:
        - $ref: '#/components/parameters/ConversationId'
      responses:
        '200':
          description: 会话详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Conversation'
                  - $ref: '#/components/schemas/Envelope'
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    patch:
      tags: [conversations]
      operationId: patchConversation
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConversationPatch' }
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Conversation'
                  - $ref: '#/components/schemas/Envelope'
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    delete:
      tags: [conversations]
      operationId: deleteConversation
      description: 删除思考（硬删，事务性）。存在派生子思考时拒绝（409 conversation_has_children），需 ?cascade_children=true 显式级联删除整棵子树；笔记资产与资产血缘保留
      parameters:
        - $ref: '#/components/parameters/ConversationId'
