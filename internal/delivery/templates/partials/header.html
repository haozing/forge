{{define "header"}}<header class="site-header">
  <div class="container header-inner">
    {{if eq .Page.Kind "home"}}<h1 class="site-heading"><a class="site-name" href="{{.Site.HomeHref}}">{{if .Site.LogoURL}}<img class="site-logo" src="{{.Site.LogoURL}}" alt="{{.Site.Name}}">{{else}}{{.Site.Name}}{{end}}</a></h1>{{else}}<a class="site-name" href="{{.Site.HomeHref}}">{{if .Site.LogoURL}}<img class="site-logo" src="{{.Site.LogoURL}}" alt="{{.Site.Name}}">{{else}}{{.Site.Name}}{{end}}</a>{{end}}
    <nav class="site-nav">
      {{range .Site.Nav}}<a href="{{.Href}}">{{.Label}}</a>{{end}}
    </nav>
    {{if .Site.Languages}}<nav class="lang-switch" aria-label="语言切换">
      {{range .Site.Languages}}<a href="{{.Href}}" hreflang="{{.Label}}">{{.Label}}</a>{{end}}
    </nav>{{end}}
    <form class="search-form" action="{{.Site.SearchHref}}" method="get">
      <input type="search" name="q" placeholder="搜索" aria-label="搜索" value="">
    </form>
  </div>
</header>{{end}}
