{{define "content"}}
<article class="article">
  <h1 class="article-title">{{.Title}}</h1>
  {{with .CoverURL}}<div class="article-cover"><img src="{{.}}" alt="{{$.Title}}" loading="lazy"></div>{{end}}
  {{template "tag_chips" .Tags}}
  <div class="article-body">{{noescape .ContentHTML}}</div>
</article>
{{end}}
