{{define "content"}}
<h1>归档</h1>
{{if .Years}}
<div class="archive">
  {{range .Years}}
  <section class="archive-year">
    <h2>{{.Year}}</h2>
    {{range .Months}}
    <div class="archive-month">
      <h3>{{.Label}}</h3>
      <ul class="archive-list">
        {{range .Items}}<li><a href="{{.Href}}">{{.Title}}</a><time>{{.PublishedOn}}</time></li>{{end}}
      </ul>
    </div>
    {{end}}
  </section>
  {{end}}
</div>
{{else}}{{template "empty" .}}{{end}}
{{end}}
