openapi: 3.1.0
info:
  title: Agent Chunzhi Admin API
  version: 0.1.0
  description: |
    Administrator API for Agent users, API key lifecycle, and direct model policies.
    Requests use a member session cookie and require the agent.manage permission.
servers:
  - url: /api/admin
    description: Internal administrator API
security:
  - MemberSession: []
paths:
  /agent-applications:
    get:
      operationId: listAgentApplications
      summary: List Agent applications and binding status
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
      responses:
        '200':
          description: Applications in the current organization.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentApplicationListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/InvalidRequest' }

  /agent-applications/{applicationId}:
    get:
      operationId: getAgentApplication
      summary: Read an Agent application binding
      parameters:
        - $ref: '#/components/parameters/AgentApplicationId'
      responses:
        '200':
          description: Agent application binding and current key status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentApplicationSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InvalidRequest' }

  /agent-applications/{applicationId}/status:
    patch:
      operationId: updateAgentApplicationStatus
      summary: Enable or disable an Agent application
      parameters:
        - $ref: '#/components/parameters/AgentApplicationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateAgentApplicationStatusRequest' }
      responses:
        '200':
          description: Application status updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpdateAgentApplicationStatusResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/InvalidRequest' }

  /agent-users:
    post:
      operationId: registerAgentUser
      summary: Create an Agent user and bound application
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterAgentRequest'
      responses:
        '201':
          description: Agent user created; plaintext API key is returned once.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterAgentResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/InvalidRequest' }

  /agent-users/{agentUserId}/api-keys/rotate:
    post:
      operationId: rotateAgentApiKey
      summary: Revoke active keys and create a replacement key
      parameters:
        - $ref: '#/components/parameters/AgentUserId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RotateApiKeyRequest'
      responses:
        '200':
          description: Replacement key created; plaintext API key is returned once.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RotateApiKeyResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/InvalidRequest' }

  /agent-users/{agentUserId}/access-policy:
    put:
      operationId: replaceAgentAccessPolicy
      summary: Replace the Agent user's resource model action allowlist
      parameters:
        - $ref: '#/components/parameters/AgentUserId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceAgentAccessPolicyRequest'
      responses:
        '200':
          description: Direct policy replaced.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplaceAgentAccessPolicyResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/InvalidRequest' }

components:
  securitySchemes:
    MemberSession:
      type: apiKey
      in: cookie
      name: agent_session
  parameters:
    AgentUserId:
      name: agentUserId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AgentApplicationId:
      name: applicationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 200 }
  schemas:
    RegisterAgentRequest:
      type: object
      required: [display_name, api_key_name, application_name, model_endpoint_id, runtime_mode]
      additionalProperties: false
      properties:
        display_name: { type: string, minLength: 1, maxLength: 200 }
        api_key_name: { type: string, minLength: 1, maxLength: 100 }
        application_name: { type: string, minLength: 1, maxLength: 200 }
        model_endpoint_id: { type: string, format: uuid }
        runtime_mode: { type: string, enum: [rag, react, workflow] }
        workflow_key: { type: string, maxLength: 100 }
        capabilities:
          type: array
          maxItems: 20
          uniqueItems: true
          items: { type: string, maxLength: 80 }
        expires_at: { type: string, format: date-time, description: Must be in the future. }
    RegisterAgentResponse:
      type: object
      required: [agent_user_id, agent_application_id, api_key, api_key_prefix, model_endpoint_id, runtime_mode, capabilities]
      properties:
        agent_user_id: { type: string, format: uuid }
        agent_application_id: { type: string, format: uuid }
        api_key: { type: string, description: Plaintext key shown only once. }
        api_key_prefix: { type: string }
        model_endpoint_id: { type: string, format: uuid }
        runtime_mode: { type: string, enum: [rag, react, workflow] }
        workflow_key: { type: string }
        capabilities: { type: array, items: { type: string } }
        expires_at: { type: string, format: date-time }
    RotateApiKeyRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        expires_at: { type: string, format: date-time, description: Must be in the future. }
    RotateApiKeyResponse:
      type: object
      required: [agent_user_id, name, api_key, api_key_prefix]
      properties:
        agent_user_id: { type: string, format: uuid }
        name: { type: string }
        api_key: { type: string, description: Plaintext replacement key shown only once. }
        api_key_prefix: { type: string }
        expires_at: { type: string, format: date-time }
    ReplaceAgentAccessPolicyRequest:
      type: object
      required: [resource_model_id, actions]
      additionalProperties: false
      properties:
        resource_model_id: { type: string, format: uuid }
        actions:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [read, create, edit, publish, archive]
    ReplaceAgentAccessPolicyResponse:
      type: object
      required: [agent_user_id, resource_model_id, actions]
      properties:
        agent_user_id: { type: string, format: uuid }
        resource_model_id: { type: string, format: uuid }
        actions: { type: array, items: { type: string } }
    AgentApplicationSummary:
      type: object
      required: [id, agent_user_id, agent_display_name, agent_status, model_endpoint_id, model_endpoint_name, model_endpoint_revision, provider_type, model_name, runtime_mode, name, status, capabilities, api_key_active, ready, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        agent_user_id: { type: string, format: uuid }
        agent_display_name: { type: string }
        agent_status: { type: string, enum: [active, disabled, deleted] }
        model_endpoint_id: { type: string, format: uuid }
        model_endpoint_name: { type: string }
        model_endpoint_revision: { type: integer, format: int64 }
        provider_type: { type: string }
        model_name: { type: string }
        runtime_mode: { type: string, enum: [rag, react, workflow] }
        workflow_key: { type: string }
        name: { type: string }
        status: { type: string, enum: [active, disabled] }
        capabilities: { type: array, items: { type: string } }
        api_key_active: { type: boolean }
        ready: { type: boolean, description: "Application, Agent user, and at least one non-expired API key are all active." }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AgentApplicationListResponse:
      type: object
      required: [items, limit]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AgentApplicationSummary' }
        limit: { type: integer, minimum: 1, maximum: 100 }
    UpdateAgentApplicationStatusRequest:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status: { type: string, enum: [active, disabled] }
    UpdateAgentApplicationStatusResponse:
      type: object
      required: [application_id, status, updated_at]
      properties:
        application_id: { type: string, format: uuid }
        status: { type: string, enum: [active, disabled] }
        updated_at: { type: string, format: date-time }
    Error:
      type: object
      required: [code, message, request_id]
      properties:
        code: { type: string }
        message: { type: string }
        request_id: { type: string }
  responses:
    Unauthorized:
      description: Missing or invalid member session.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: Member is not an organization administrator.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: Agent user or resource model does not exist in the organization.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Conflict:
      description: Idempotency key was already used or policy state conflicted.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    InvalidRequest:
      description: Request validation failed.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
