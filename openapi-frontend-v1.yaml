openapi: 3.1.0
info:
  title: Agent Chunzhi Frontend API
  version: 0.1.0
  description: |
    Member-session APIs for running the selected built-in Agent application.
    and validating its citations. The member session locates the active
    AgentSession; data authorization uses the Agent user bound to that session.
servers:
  - url: /api/frontend
    description: First-party frontend API
security:
  - MemberSession: []
paths:
  /workspaces/{workspaceId}/conversations:
    post:
      operationId: createConversation
      summary: Create a Chat conversation and its bound Note asset
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateConversationRequest' }
      responses:
        '201':
          description: Conversation created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
  /conversations/{conversationId}:
    get:
      operationId: getConversation
      summary: Get a member-owned conversation and its bound Note
      parameters:
        - name: conversationId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
      responses:
        '200':
          description: Conversation details.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /conversations/{conversationId}/messages:
    get:
      operationId: listConversationMessages
      summary: List immutable messages in sequence order
      parameters:
        - name: conversationId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
      responses:
        '200':
          description: Conversation messages.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/MessageDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
    post:
      operationId: appendConversationMessage
      summary: Append a message block to a conversation
      parameters:
        - name: conversationId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AppendMessageRequest' }
      responses:
        '201':
          description: Message persisted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
  /conversations/{conversationId}/note/sync:
    post:
      operationId: syncConversationNote
      summary: Render conversation messages into a new internal Note version
      parameters:
        - name: conversationId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Note version created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NoteSyncResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
  /conversations/{conversationId}/note/publish:
    post:
      operationId: publishConversationNote
      summary: Publish the expected working Note version
      parameters:
        - name: conversationId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotePublishRequest' }
      responses:
        '201':
          description: Note version published.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotePublishResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
  /conversations/{conversationId}/derivations:
    post:
      operationId: createConversationDerivation
      summary: Create a derived Chat and Note from selected source blocks
      parameters:
        - name: conversationId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateDerivationRequest' }
      responses:
        '201':
          description: Derived conversation created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DerivationResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
  /derivations/{derivationId}:
    get:
      operationId: getDerivation
      summary: Get a derived conversation's audit state
      parameters:
        - name: derivationId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
      responses:
        '200':
          description: Derivation state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DerivationResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
  /derivations/{derivationId}/finalize:
    post:
      operationId: finalizeDerivation
      summary: Finalize a derived conversation as independent, reference, or merge
      parameters:
        - name: derivationId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FinalizeDerivationRequest' }
      responses:
        '201':
          description: Derivation finalized.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FinalizeResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
  /conversations/{conversationId}/media:
    post:
      operationId: registerConversationMedia
      summary: Bind an uploaded audio or video attachment to a conversation
      parameters:
        - name: conversationId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterMediaRequest' }
      responses:
        '201':
          description: Media registered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
  /conversation-media/{mediaId}:
    get:
      operationId: getConversationMedia
      summary: Get conversation media processing state
      parameters:
        - name: mediaId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
      responses:
        '200':
          description: Media state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
  /conversation-media/{mediaId}/transcribe:
    post:
      operationId: transcribeConversationMedia
      summary: Queue controlled transcription for conversation media
      parameters:
        - name: mediaId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Transcription job queued; completion creates a transcription Block.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
  /agent-sessions/{sessionId}/references/validate:
    post:
      operationId: validateAgentSessionReferences
      summary: Validate Agent answer references
      description: |
        Re-checks cited assets against the bound Agent user's live read allowlist,
        current published pointer, and agent_tool policy.
        The member's resource permissions are not intersected with the Agent
        user's data scope.
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ValidateAgentReferencesRequest' }
      responses:
        '200':
          description: Valid references; rejected citations are counted but not returned.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidateAgentReferencesResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
  /agent-sessions/{sessionId}/chat:
    post:
      operationId: chatAgentSession
      summary: Send a question to the selected Agent application
      description: |
        Runs the configured Eino runtime using the Agent application bound to
        this member-owned session. The member's permissions are not used as
        the Agent data scope; citations are re-checked with the bound Agent
        user's live read allowlist before they are returned.
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentChatRequest' }
      responses:
        '200':
          description: Answer with references authorized for the bound Agent.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentChatResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /agent-sessions/{sessionId}/chat/stream:
    post:
      operationId: streamAgentSession
      summary: Stream a question to the selected Agent application
      description: |
        Streams answer deltas as Server-Sent Events. The final complete event
        contains references authorized for the bound Agent user. Provider and
        reference errors are emitted as an error event after the stream starts.
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentChatRequest' }
      responses:
        '200':
          description: Server-Sent Events stream.
          content:
            text/event-stream:
              schema: { $ref: '#/components/schemas/AgentChatStreamEvent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        Optional. When supplied (16-200 chars), the same caller + operation +
        request hash replays the stored response with Idempotency-Replayed:
        true; a malformed header answers 422 idempotency_key_invalid. Omitted
        keys execute normally without dedup.
      schema: { type: string, minLength: 16, maxLength: 200 }
  securitySchemes:
    MemberSession:
      type: apiKey
      in: cookie
      name: agent_session
  schemas:
    Uuid:
      type: string
      format: uuid
    ValidateAgentReferencesRequest:
      type: object
      additionalProperties: false
      required: [references]
      properties:
        references:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required: [asset_id, asset_version_id]
            properties:
              asset_id: { $ref: '#/components/schemas/Uuid' }
              asset_version_id: { $ref: '#/components/schemas/Uuid' }
    AgentReference:
      type: object
      required: [asset_id, asset_version_id, title, url]
      properties:
        asset_id: { $ref: '#/components/schemas/Uuid' }
        asset_version_id: { $ref: '#/components/schemas/Uuid' }
        title: { type: string }
        url: { type: string, format: uri }
        source_excerpt: { type: string }
        updated_at: { type: string, format: date-time }
    ValidateAgentReferencesResponse:
      type: object
      required: [references, rejected_count]
      properties:
        references:
          type: array
          items: { $ref: '#/components/schemas/AgentReference' }
        rejected_count: { type: integer, minimum: 0 }
    AgentChatRequest:
      type: object
      additionalProperties: false
      required: [query]
      properties:
        query: { type: string, minLength: 1, maxLength: 10000 }
        conversation_id: { type: string, maxLength: 200 }
    CreateConversationRequest:
      type: object
      additionalProperties: false
      properties:
        agent_application_id: { $ref: '#/components/schemas/Uuid' }
        title: { type: string, maxLength: 500 }
        source: { type: string, enum: [chat_interface, voice, meeting, imported] }
        visibility: { type: string, enum: [private, workspace, internal] }
    ConversationResponse:
      type: object
      required: [conversation_id, workspace_id, container_id, note_container_id, note_asset_id, agent_application_id, bound_agent_user_id, status]
      properties:
        conversation_id: { $ref: '#/components/schemas/Uuid' }
        workspace_id: { $ref: '#/components/schemas/Uuid' }
        container_id: { $ref: '#/components/schemas/Uuid' }
        note_container_id: { $ref: '#/components/schemas/Uuid' }
        note_asset_id: { $ref: '#/components/schemas/Uuid' }
        agent_application_id: { $ref: '#/components/schemas/Uuid' }
        bound_agent_user_id: { $ref: '#/components/schemas/Uuid' }
        status: { type: string }
        title: { type: string }
        source: { type: string }
        visibility: { type: string }
        created_at: { type: string }
        updated_at: { type: string }
    AppendMessageRequest:
      type: object
      additionalProperties: false
      required: [role, content]
      properties:
        role: { type: string, enum: [human, assistant, system, tool] }
        content: { type: string }
        content_format: { type: string, enum: [plain_text, markdown, json] }
        provider_conversation_id: { type: string, maxLength: 200 }
        provider_message_id: { type: string, maxLength: 200 }
        status: { type: string, enum: [pending, completed, failed, cancelled] }
        reply_to_block_id: { $ref: '#/components/schemas/Uuid' }
    MessageResponse:
      type: object
      required: [block_revision_id, block_id, conversation_id, sequence_no, role, status]
      properties:
        block_revision_id: { $ref: '#/components/schemas/Uuid' }
        block_id: { $ref: '#/components/schemas/Uuid' }
        conversation_id: { $ref: '#/components/schemas/Uuid' }
        sequence_no: { type: integer, minimum: 1 }
        role: { type: string }
        status: { type: string }
    MessageDetail:
      type: object
      required: [block_revision_id, block_id, conversation_id, role, content, content_format, status, sequence_no, created_at]
      properties:
        block_revision_id: { $ref: '#/components/schemas/Uuid' }
        block_id: { $ref: '#/components/schemas/Uuid' }
        conversation_id: { $ref: '#/components/schemas/Uuid' }
        role: { type: string, enum: [human, assistant, system, tool, transcription] }
        content: { type: string }
        content_format: { type: string, enum: [plain_text, markdown, json] }
        status: { type: string }
        provider_conversation_id: { type: string }
        provider_message_id: { type: string }
        sequence_no: { type: integer, minimum: 1 }
        created_at: { type: string }
    NoteSyncResponse:
      type: object
      required: [conversation_id, note_asset_id, asset_version_id, message_count, status]
      properties:
        conversation_id: { $ref: '#/components/schemas/Uuid' }
        note_asset_id: { $ref: '#/components/schemas/Uuid' }
        asset_version_id: { $ref: '#/components/schemas/Uuid' }
        message_count: { type: integer, minimum: 0 }
        status: { type: string, enum: [internal] }
    NotePublishRequest:
      type: object
      additionalProperties: false
      required: [expected_version_id]
      properties:
        expected_version_id: { $ref: '#/components/schemas/Uuid' }
    NotePublishResponse:
      type: object
      required: [conversation_id, note_asset_id, asset_version_id, publication_status, quality]
      properties:
        conversation_id: { $ref: '#/components/schemas/Uuid' }
        note_asset_id: { $ref: '#/components/schemas/Uuid' }
        asset_version_id: { $ref: '#/components/schemas/Uuid' }
        publication_status: { type: string, enum: [published] }
        quality: { type: string, enum: [human_confirmed, high_quality] }
    CreateDerivationRequest:
      type: object
      additionalProperties: false
      required: [source_block_revision_ids]
      properties:
        source_block_revision_ids:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: '#/components/schemas/Uuid' }
        context_policy: { type: string, enum: [summary_only, selected_only, full] }
        title: { type: string, maxLength: 500 }
    DerivationResponse:
      type: object
      required: [derivation_id, source_conversation_id, target_conversation_id, target_note_asset_id, operation, context_policy, status]
      properties:
        derivation_id: { $ref: '#/components/schemas/Uuid' }
        source_conversation_id: { $ref: '#/components/schemas/Uuid' }
        target_conversation_id: { $ref: '#/components/schemas/Uuid' }
        target_note_asset_id: { $ref: '#/components/schemas/Uuid' }
        operation: { type: string, enum: [create_chat, link, merge] }
        context_policy: { type: string, enum: [summary_only, selected_only, full] }
        status: { type: string }
    FinalizeDerivationRequest:
      type: object
      additionalProperties: false
      required: [disposition]
      properties:
        disposition: { type: string, enum: [independent, reference, merge] }
        target_asset_id: { $ref: '#/components/schemas/Uuid' }
        expected_source_asset_version_id: { $ref: '#/components/schemas/Uuid' }
        expected_target_asset_version_id: { $ref: '#/components/schemas/Uuid' }
        expected_container_version_id: { $ref: '#/components/schemas/Uuid' }
        merge_mode: { type: string, enum: [append, insert_after, replace_block] }
        target_block_id: { $ref: '#/components/schemas/Uuid' }
    FinalizeResponse:
      type: object
      required: [derivation_id, disposition, asset_id, asset_version_id, status]
      properties:
        derivation_id: { $ref: '#/components/schemas/Uuid' }
        disposition: { type: string, enum: [independent, reference, merge] }
        asset_id: { $ref: '#/components/schemas/Uuid' }
        asset_version_id: { $ref: '#/components/schemas/Uuid' }
        relation_id: { $ref: '#/components/schemas/Uuid' }
        status: { type: string, enum: [completed] }
    RegisterMediaRequest:
      type: object
      additionalProperties: false
      required: [attachment_id, media_kind]
      properties:
        attachment_id: { $ref: '#/components/schemas/Uuid' }
        media_kind: { type: string, enum: [audio, video] }
        language: { type: string, maxLength: 32 }
        duration_ms: { type: integer, minimum: 0, maximum: 86400000 }
    MediaResponse:
      type: object
      required: [media_id, conversation_id, attachment_id, media_kind, status, created_at, updated_at]
      properties:
        media_id: { $ref: '#/components/schemas/Uuid' }
        conversation_id: { $ref: '#/components/schemas/Uuid' }
        attachment_id: { $ref: '#/components/schemas/Uuid' }
        media_kind: { type: string, enum: [audio, video] }
        status: { type: string, enum: [uploaded, transcription_queued, transcribing, completed, failed] }
        language: { type: string }
        duration_ms: { type: integer, minimum: 0 }
        transcription_job_id: { $ref: '#/components/schemas/Uuid' }
        transcription_block_revision_id: { $ref: '#/components/schemas/Uuid' }
        created_at: { type: string }
        updated_at: { type: string }
    AgentChatResponse:
      type: object
      required: [answer, references, rejected_reference_count]
      properties:
        answer: { type: string }
        conversation_id: { type: string }
        message_id: { type: string }
        references:
          type: array
          items: { $ref: '#/components/schemas/AgentReference' }
        rejected_reference_count: { type: integer, minimum: 0 }
    AgentChatStreamEvent:
      type: object
      required: [event, data]
      properties:
        event:
          type: string
          enum: [delta, complete, error]
        data:
          description: JSON payload for the event. Delta contains `delta`; complete contains AgentChatResponse; error contains `code` and `message`.
          oneOf:
            - type: object
              required: [delta]
              properties:
                delta: { type: string }
            - { $ref: '#/components/schemas/AgentChatResponse' }
            - type: object
              required: [code, message]
              properties:
                code: { type: string }
                message: { type: string }
    Error:
      type: object
      required: [code, message, request_id]
      properties:
        code: { type: string }
        message: { type: string }
        request_id: { type: string }
  responses:
    Unauthorized:
      description: Missing or invalid member session.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Only a member session can validate frontend references.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: The session is expired, revoked, or not owned by the member.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InvalidRequest:
      description: Request validation failed.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BadGateway:
      description: The configured model endpoint returned an error.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ServiceUnavailable:
      description: The configured model endpoint is unavailable.
      content:
