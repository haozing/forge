<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Forge · 垂直领域数据资产库</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="知识库导航">
      <div class="brand-row">
        <div class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></div>
        <div class="brand-name">Forge <small>资产中台</small></div>
        <button class="icon-btn sidebar-collapse" title="收起侧栏" aria-label="收起侧栏"><i data-icon="panel-left"></i></button>
      </div>

      <button class="workspace-select" id="workspaceSelect" aria-label="切换知识库">
        <span class="workspace-icon"><i data-icon="database"></i></span>
        <span class="workspace-copy"><strong>经典镜头库</strong><small>企业知识资产</small></span>
        <i data-icon="chevrons-up-down" class="workspace-chevron"></i>
      </button>

      <div class="sidebar-search"><i data-icon="search"></i><input placeholder="搜索内容" aria-label="搜索内容" /><kbd>⌘ K</kbd></div>

      <nav class="tree-nav" aria-label="资源目录">
        <section class="nav-group has-children is-open" data-group="thoughts">
          <button class="nav-group-head" aria-expanded="true"><i data-icon="sparkles"></i><span>思考</span><i data-icon="chevron-right" class="group-chevron"></i></button>
          <div class="nav-group-body">
            <button class="tree-item active" data-view="thoughts"><i data-icon="sparkles"></i><span>新思考</span><span class="item-count">3</span></button>
            <button class="tree-item" data-view="assistant"><i data-icon="bot"></i><span>镜头问答助手</span><span class="online-dot"></span></button>
          </div>
        </section>

        <section class="nav-group has-children" data-group="pending">
          <button class="nav-group-head" aria-expanded="false"><i data-icon="inbox"></i><span>待整理</span><span class="item-count">4</span><i data-icon="chevron-right" class="group-chevron"></i></button>
          <div class="nav-group-body">
            <div class="pending-chats">
              <button class="tree-item pending-chat" data-thought-title="关于团队性格周期的探讨"><i data-icon="message-circle"></i><span>团队性格周期的探讨</span><span class="pending-dot"></span></button>
              <button class="tree-item pending-chat" data-thought-title="Agent 架构讨论"><i data-icon="message-circle"></i><span>Agent 架构讨论</span><span class="pending-dot"></span></button>
              <button class="tree-item pending-chat" data-thought-title="运营策略的三个试验"><i data-icon="message-circle"></i><span>运营策略的三个试验</span><span class="pending-dot amber"></span></button>
              <button class="tree-item pending-chat" data-thought-title="从对话中提炼镜头观点"><i data-icon="message-circle"></i><span>从对话中提炼镜头观点</span><span class="pending-dot"></span></button>
            </div>
          </div>
        </section>

        <section class="nav-group has-children" data-group="documents">
          <button class="nav-group-head" aria-expanded="false"><i data-icon="folder"></i><span>文档库</span><i data-icon="chevron-right" class="group-chevron"></i></button>
          <div class="nav-group-body">
            <button class="tree-item folder-tree-item" data-view="my-documents"><i data-icon="folder-open"></i><span>我的</span><span class="item-count">6</span></button>
            <button class="tree-item folder-tree-item" data-view="documents"><i data-icon="folder-open"></i><span>全部文档</span><span class="item-count">24</span></button>
            <button class="tree-item folder-tree-item folder-toggle is-expanded" data-folder-toggle="standards" data-doc-node="团队规范"><i data-icon="chevron-right" class="folder-chevron"></i><i data-icon="folder"></i><span>团队规范</span><span class="item-count">8</span></button>
            <div class="folder-children is-open" data-folder-children="standards">
              <button class="tree-item folder-tree-item nested" data-doc-node="录入与审核"><i data-icon="file-text"></i><span>录入与审核</span><span class="item-count">4</span></button>
              <button class="tree-item folder-tree-item nested" data-doc-node="智能应用"><i data-icon="file-text"></i><span>智能应用</span><span class="item-count">3</span></button>
            </div>
            <button class="tree-item folder-tree-item" data-doc-node="创作资料"><i data-icon="file-text"></i><span>创作资料</span><span class="item-count">12</span></button>
            <button class="tree-item folder-tree-item" data-doc-node="未分类"><i data-icon="file-text"></i><span>未分类</span><span class="item-count">4</span></button>
          </div>
        </section>

        <button class="tree-item standalone-item" data-view="faq"><i data-icon="circle-help"></i><span>FAQ 知识库</span><span class="status-dot purple"></span></button>
        <button class="tree-item standalone-item" data-view="shots"><i data-icon="clapperboard"></i><span>经典镜头库</span><span class="status-dot"></span></button>

      </nav>

      <div class="sidebar-footer">
        <button class="tree-item" data-view="settings"><i data-icon="settings-2"></i><span>设置</span></button>
        <div class="profile-row"><div class="avatar">林</div><div><strong>林默</strong><small>内容编辑</small></div><button class="icon-btn" title="更多" aria-label="更多"><i data-icon="more-horizontal"></i></button></div>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <div class="breadcrumb"><span>经典镜头库</span><i data-icon="chevron-right"></i><strong id="breadcrumbTitle">新思考</strong></div>
        <div class="top-actions"><span class="sync-status"><span class="sync-dot"></span>已同步</span><button class="icon-btn" title="帮助" aria-label="帮助"><i data-icon="circle-help"></i></button><button class="icon-btn" title="通知" aria-label="通知"><i data-icon="bell"></i><span class="notification-dot"></span></button><div class="top-avatar">林</div></div>
      </header>

      <section class="content-view" id="contentView" aria-live="polite"></section>
    </main>
  </div>

  <div class="toast" id="toast" role="status"></div>
  <script src="./api/client.js"></script>
  <script src="./api/workspaces.js"></script>
  <script src="./api/models.js"></script>
  <script src="./api/assets.js"></script>
  <script src="./api/containers.js"></script>
  <script src="./api/reviews.js"></script>
  <script src="./api/conversations.js"></script>
  <script src="./api/automation.js"></script>
  <script src="./api/query.js"></script>
  <script src="./api/transfers.js"></script>
  <script src="./render/schema.js"></script>
  <script src="./app.js"></script>
</body>
</html>
