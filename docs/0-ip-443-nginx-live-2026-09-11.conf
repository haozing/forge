# IP-only HTTPS (self-signed). /api -> forge (docker), / -> ynt web (docker).

server {
    listen 443 ssl default_server;
    server_name 101.35.49.253;

    ssl_certificate /etc/nginx/ssl/ip-selfsigned/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/ip-selfsigned/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 32m;

    # forge API (cookie-authenticated surface).
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite (not append): the API trusts the FIRST X-Forwarded-For hop.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
        proxy_cache off;
    }

    # forge health endpoints (kept on the API process).
    location = /healthz { proxy_pass http://127.0.0.1:8080; }
    location = /readyz  { proxy_pass http://127.0.0.1:8080; }

    # forge public-site SSR face: Go-template pages and delivery static
    # assets are served by the API process, never the web frontend.
    location /sites/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
    # MCP server (Streamable HTTP): no buffering so SSE streaming works.
    location /mcp {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_buffering off;
        proxy_cache off;
    }
    location = /.well-known/agents.json { proxy_pass http://127.0.0.1:8080; }
    location = /llms.txt { proxy_pass http://127.0.0.1:8080; }

    location /static/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }

    # Web frontend (Next.js standalone in ynt-web container).
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

