      responses:
        '201':
          description: 已添加
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/WorkspaceMemberDetail'
                  - $ref: '#/components/schemas/Envelope'
        '409': { $ref: '#/components/responses/Error' }
  /api/v2/workspaces/{workspaceId}/members/me/leave:
    post:
      tags: [workspaces]
      operationId: leaveWorkspace
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204': { description: 已退出（最后一名 active admin 不能退出） }
        '409': { $ref: '#/components/responses/Error' }
  /api/v2/workspaces/{workspaceId}/eligible-members:
    get:
      tags: [workspaces]
      operationId: listEligibleWorkspaceMembers
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
