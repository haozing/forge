        '200':
          description: 同组织 active 且未加入当前工作区的成员（脱敏邮箱）
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/EligibleMember' }
                      page: { $ref: '#/components/schemas/CursorPage' }
                  - $ref: '#/components/schemas/Envelope'
  /api/v2/workspaces/{workspaceId}/members/{membershipId}:
    patch:
      tags: [workspaces]
      operationId: patchWorkspaceMember
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/MembershipId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, enum: [admin, editor, reviewer, viewer] }
      responses:
        '200':
          description: 已变更
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/WorkspaceMemberDetail'
                  - $ref: '#/components/schemas/Envelope'
        '409': { $ref: '#/components/responses/Error' }
    delete:
      tags: [workspaces]
      operationId: removeWorkspaceMember
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/MembershipId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204': { description: 已移除 }
        '409': { $ref: '#/components/responses/Error' }
  /api/v2/workspaces/{workspaceId}/invitations:
    get:
      tags: [workspaces]
      operationId: listWorkspaceInvitations
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: 当前工作区的 workspace-scope 邀请
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Invitation' }
                      page: { $ref: '#/components/schemas/CursorPage' }
                  - $ref: '#/components/schemas/Envelope'
    post:
      tags: [workspaces]
      operationId: createWorkspaceInvitation
      description: workspace admin 创建 authority_scope=workspace 邀请
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
                display_name: { type: string }
                role: { type: string, enum: [admin, editor, reviewer, viewer] }
                expires_in_hours: { type: integer }
      responses:
        '201':
          description: 已创建，token 仅此一次返回
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/InvitationWithToken'
                  - $ref: '#/components/schemas/Envelope'
        '409': { $ref: '#/components/responses/Error' }
  /api/v2/workspaces/{workspaceId}/invitations/{invitationId}/resend:
    post:
      tags: [workspaces]
      operationId: resendWorkspaceInvitation
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/InvitationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 已换发
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Invitation'
                  - $ref: '#/components/schemas/Envelope'
  /api/v2/workspaces/{workspaceId}/invitations/{invitationId}/revoke:
    post:
      tags: [workspaces]
      operationId: revokeWorkspaceInvitation
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/InvitationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204': { description: 已撤销 }
        '409': { $ref: '#/components/responses/Error' }
  /api/v2/workspaces/{workspaceId}/tags:
    get:
      tags: [tags]
      operationId: listTags
      description: 工作区标签目录（默认只返回 active，游标稳定排序；usage 不参与排序）
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - name: q
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema:
            type: string
            enum: [active, archived, all]
            default: active
        - name: sort
          in: query
          schema:
            type: string
            enum: [key:asc, display_name:asc, created_at:desc]
            default: key:asc
        - name: include_usage
          in: query
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: 标签分页
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Tag' }
                      page: { $ref: '#/components/schemas/CursorPage' }
                  - $ref: '#/components/schemas/Envelope'
    post:
      tags: [tags]
      operationId: createTag
      description: 创建标签（tag.manage）；同 key 并发创建只有一个成功，其余 409 tag_key_exists
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [display_name]
              properties:
                key: { type: string, maxLength: 100 }
                display_name: { type: string, maxLength: 100 }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Tag'
                  - $ref: '#/components/schemas/Envelope'
        '409': { $ref: '#/components/responses/Error' }
  /api/v2/workspaces/{workspaceId}/tags/{tagId}:
    get:
      tags: [tags]
      operationId: getTag
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/TagId'
      responses:
        '200':
          description: 标签详情（含 ETag）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Tag'
                  - $ref: '#/components/schemas/Envelope'
        '404': { $ref: '#/components/responses/Error' }
    patch:
      tags: [tags]
      operationId: renameTag
      description: 仅接受 display_name；key/slug 是不可变身份；If-Match 必带且为 tag revision
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/TagId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [display_name]
              properties:
                display_name: { type: string, maxLength: 100 }
      responses:
        '200':
          description: 已重命名
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Tag'
                  - $ref: '#/components/schemas/Envelope'
        '412': { $ref: '#/components/responses/Error' }
  /api/v2/workspaces/{workspaceId}/tags/{tagId}/archive:
    post:
      tags: [tags]
      operationId: archiveTag
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/TagId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: 已归档（历史关系保持不变）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Tag'
                  - $ref: '#/components/schemas/Envelope'
        '409': { $ref: '#/components/responses/Error' }
  /api/v2/workspaces/{workspaceId}/tags/{tagId}/restore:
    post:
      tags: [tags]
      operationId: restoreTag
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/TagId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: 已恢复（key/slug 身份不变）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Tag'
                  - $ref: '#/components/schemas/Envelope'
        '409': { $ref: '#/components/responses/Error' }
  /api/v2/workspaces/{workspaceId}/tag-facets:
    get:
      tags: [tags]
      operationId: listTagFacets
      description: 标签 facet 计数（COUNT(DISTINCT asset_id)）；未知 key → 422 unknown_tag，矛盾组合 → 422 contradictory_tag_filter
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - name: scope
          in: query
          schema:
            type: string
            enum: [working, published]
            default: working
        - name: resource_model_id
          in: query
          schema: { type: string, format: uuid }
        - name: visibility
          in: query
          schema: { type: string }
        - name: publication_status
          in: query
          schema: { type: string }
        - name: tags_any
          in: query
          description: 可重复的 query 参数（normalized key）
          schema:
            type: array
            items: { type: string }
          style: form
          explode: true
        - name: tags_all
          in: query
          schema:
            type: array
            items: { type: string }
          style: form
          explode: true
        - name: tags_none
          in: query
          schema:
            type: array
            items: { type: string }
          style: form
          explode: true
        - name: tag_status
          in: query
          schema:
            type: string
            enum: [active, archived]
            default: active
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: facet 计数（按计数降序）
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/TagFacet' }
                      page: { $ref: '#/components/schemas/CursorPage' }
                  - $ref: '#/components/schemas/Envelope'
        '422': { $ref: '#/components/responses/Error' }
  /api/open/v2/hooks/assets:
    post:
      tags: [tags]
      operationId: createWebhookAsset
      description: |
        Webhook 资产推送（Open API Key 认证）。tag_keys 只能引用同 workspace 已有 active 标签，
        unknown/archived key 整个请求 422（unknown_tag / tag_archived）；请求含旧 tags 字段返回
        422 legacy_tags_field_not_supported。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                source: { type: string, enum: [webhook] }
                external_ref: { type: string, minLength: 16, maxLength: 200 }
                workspace_id: { type: string, format: uuid }
                resource_model_id: { type: string, format: uuid }
                title: { type: string, nullable: true }
                markdown: { type: string, nullable: true }
                fields: { type: object, additionalProperties: true }
                tag_keys:
                  type: array
                  maxItems: 100
                  items: { type: string }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      asset: { $ref: '#/components/schemas/Asset' }
                      resource_model_id: { type: string, format: uuid }
                      workspace_id: { type: string, format: uuid }
                      external_ref: { type: string }
                      received_at: { type: string, format: date-time }
                      replayed: { type: boolean }
                  - $ref: '#/components/schemas/Envelope'
        '200':
          description: external_ref 重放
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      asset: { $ref: '#/components/schemas/Asset' }
                      replayed: { type: boolean }
                  - $ref: '#/components/schemas/Envelope'
        '422': { $ref: '#/components/responses/Error' }
components:
  responses:
    Error:
      description: v2 错误信封
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  parameters:
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AssetId:
      name: assetId
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    InvitationId:
      name: invitationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MembershipId:
      name: membershipId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TagId:
      name: tagId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Cursor:
      name: cursor
      in: query
      schema: { type: string, nullable: true }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 200 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: string }
  schemas:
    Envelope:
      type: object
      properties:
        request_id:
          type: string
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code: { type: string }
            message: { type: string }
            request_id: { type: string }
            details:
              type: object
              additionalProperties: true
              nullable: true
    CursorPage:
