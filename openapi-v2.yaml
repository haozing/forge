          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      stats: { $ref: '#/components/schemas/WorkspaceStats' }
                      counts: { $ref: '#/components/schemas/WorkspaceCounts' }
                  - $ref: '#/components/schemas/Envelope'
  /api/v2/workspaces/{workspaceId}/members:
    get:
      tags: [workspaces]
      operationId: listWorkspaceMembers
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: 成员列表
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/WorkspaceMemberDetail' }
                      page: { $ref: '#/components/schemas/CursorPage' }
                  - $ref: '#/components/schemas/Envelope'
    post:
      tags: [workspaces]
      operationId: addWorkspaceMember
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, role]
              properties:
                user_id: { type: string, format: uuid }
