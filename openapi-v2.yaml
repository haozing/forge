      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/WorkspaceSettings'
                  - $ref: '#/components/schemas/Envelope'
  /api/v2/workspaces/{workspaceId}/summary:
    get:
      tags: [workspaces]
      operationId: getWorkspaceSummary
