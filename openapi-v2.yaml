openapi: 3.0.3
info:
  title: AgentChunzhi v2 API
  version: 2.0.0-phase2
  description: |
    唯一 v2 契约。入口族：
    - /api/v2/... 成员会话和工作区管理 API
    - /api/open/v2/... Agent 和外部系统 API Key API
    - /api/public/v2/... 匿名或站点访问 API
    阶段 0 冻结全局组件与核心资源名；未实现的领域只冻结资源命名，不注册假 handler。
    阶段 1 增补 sessions、me、preferences、password-resets、organization 与 workspace 治理/成员/邀请路径。
    阶段 2 增补 tags、tag-facets 与 /api/open/v2/hooks/assets（tag_keys）；AssetDraft 支持 tag_ids。
servers:
  - url: /
tags:
  - name: publication-requests
  - name: assets
  - name: identity
  - name: workspaces
  - name: tags
  - name: query
  - name: sites
paths:
  /api/v2/workspaces/{workspaceId}/publication-requests:
    get:
      tags: [publication-requests]
      operationId: listPublicationRequests
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/PublicationRequestStatus'
      responses:
        '200':
          description: 审核队列
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PublicationRequestListData'
                  - $ref: '#/components/schemas/Envelope'
    post:
      tags: [publication-requests]
      operationId: submitPublicationRequest
      description: 为资产当前 working version 提交发布审批
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [asset_id, draft_revision]
              properties:
                asset_id:
                  type: string
                  format: uuid
                draft_revision:
                  type: integer
                comment:
                  type: string
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PublicationRequest'
                  - $ref: '#/components/schemas/Envelope'
  /api/v2/workspaces/{workspaceId}/publication-requests/{requestId}:
    get:
      tags: [publication-requests]
      operationId: getPublicationRequest
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - name: requestId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 审核详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PublicationRequest'
                  - $ref: '#/components/schemas/Envelope'
  /api/v2/workspaces/{workspaceId}/publication-requests/{requestId}/approve:
    post:
      tags: [publication-requests]
      operationId: approvePublicationRequest
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - name: requestId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                comment: { type: string }
      responses:
        '200':
          description: 已批准并发布
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PublicationRequest'
                  - $ref: '#/components/schemas/Envelope'
  /api/v2/workspaces/{workspaceId}/publication-requests/{requestId}/reject:
    post:
      tags: [publication-requests]
      operationId: rejectPublicationRequest
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - name: requestId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [comment]
              properties:
                comment: { type: string }
      responses:
        '200':
          description: 已拒绝
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PublicationRequest'
                  - $ref: '#/components/schemas/Envelope'
  /api/v2/workspaces/{workspaceId}/publication-requests/{requestId}/cancel:
    post:
      tags: [publication-requests]
      operationId: cancelPublicationRequest
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - name: requestId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        '200':
          description: 已取消
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PublicationRequest'
                  - $ref: '#/components/schemas/Envelope'
  /api/v2/workspaces/{workspaceId}/publication-requests/{requestId}/comments:
    post:
      tags: [publication-requests]
      operationId: createPublicationComment
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - name: requestId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string }
      responses:
        '201':
          description: 评论已创建
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PublicationComment'
                  - $ref: '#/components/schemas/Envelope'
  /api/v2/workspaces/{workspaceId}/publication-requests/batch:
    post:
      tags: [publication-requests]
      operationId: batchPublicationRequests
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, items]
              properties:
                decision:
                  type: string
                  enum: [approve, reject]
                items:
                  type: array
                  maxItems: 100
                  items:
                    type: object
                    required: [request_id]
                    properties:
                      request_id: { type: string, format: uuid }
                      comment: { type: string }
      responses:
        '200':
          description: 批量结果（逐项）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PublicationBatchResult'
                  - $ref: '#/components/schemas/Envelope'
  /api/v2/assets/{assetId}/draft:
    patch:
      tags: [assets]
      operationId: autosaveAssetDraft
      description: AssetDraft 自动保存；If-Match 携带 draft revision；tag_ids 省略表示保留，传数组（可空）表示整组替换
      parameters:
        - $ref: '#/components/parameters/AssetId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetDraftPatch'
      responses:
        '200':
          description: 已保存（返回 draft 与当前标签 summaries）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AssetDraft'
                  - $ref: '#/components/schemas/Envelope'
  /api/v2/assets/{assetId}/commit-draft:
    post:
      tags: [assets]
      operationId: commitAssetDraft
      parameters:
        - $ref: '#/components/parameters/AssetId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [draft_revision]
              properties:
                draft_revision: { type: integer }
      responses:
        '201':
          description: 新版本已创建
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AssetVersion'
                  - $ref: '#/components/schemas/Envelope'
  /api/v2/assets/{assetId}/publish:
    post:
      tags: [assets]
      operationId: publishAsset
      parameters:
        - $ref: '#/components/parameters/AssetId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                draft_revision: { type: integer }
      responses:
        '200':
          description: 已发布
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Asset'
                  - $ref: '#/components/schemas/Envelope'
  /api/v2/assets/{assetId}/archive:
    post:
      tags: [assets]
      operationId: archiveAsset
      parameters:
        - $ref: '#/components/parameters/AssetId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 已归档
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Asset'
                  - $ref: '#/components/schemas/Envelope'
  /api/v2/assets/{assetId}/restore:
    post:
      tags: [assets]
      operationId: restoreAsset
      parameters:
        - $ref: '#/components/parameters/AssetId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 已恢复为草稿
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Asset'
                  - $ref: '#/components/schemas/Envelope'
  /api/v2/asset-versions/{versionId}/confirm:
    post:
      tags: [assets]
      operationId: confirmAssetVersion
      description: 人工确认：创建内容相同的派生版本并写入 human_confirmed
      parameters:
        - name: versionId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: 派生版本已创建
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AssetVersion'
                  - $ref: '#/components/schemas/Envelope'
  /api/public/v2/sessions:
    post:
      tags: [identity]
      operationId: createSession
      description: 匿名邮箱登录。每次尝试消耗 login_email 与 login_ip 限流桶；失败统一 401
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: 登录成功，返回成员摘要并下发会话 cookie
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Me'
                  - $ref: '#/components/schemas/Envelope'
        '401': { $ref: '#/components/responses/Error' }
        '429':
          description: 限流拒绝，携带 Retry-After
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/v2/sessions:
    get:
      tags: [identity]
      operationId: listSessions
      responses:
        '200':
          description: 当前活跃会话列表（is_current 标记当前会话）
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/SessionInfo' }
                      page: { $ref: '#/components/schemas/CursorPage' }
                  - $ref: '#/components/schemas/Envelope'
  /api/v2/sessions/current:
    delete:
      tags: [identity]
      operationId: logout
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204': { description: 已登出并清除 cookie }
        '401': { $ref: '#/components/responses/Error' }
  /api/v2/sessions/{sessionId}:
    delete:
      tags: [identity]
      operationId: revokeSession
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204': { description: 已撤销 }
        '404': { $ref: '#/components/responses/Error' }
  /api/v2/me:
    get:
      tags: [identity]
      operationId: getMe
      responses:
        '200':
          description: 成员资料 + 组织 + allowed_actions
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Me'
                  - $ref: '#/components/schemas/Envelope'
    patch:
      tags: [identity]
      operationId: patchMe
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [display_name]
              properties:
                display_name: { type: string, maxLength: 80 }
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Profile'
                  - $ref: '#/components/schemas/Envelope'
        '412': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
  /api/v2/me/password:
    put:
      tags: [identity]
      operationId: changePassword
      description: 修改密码并撤销除当前会话外的所有会话
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string, minLength: 12, maxLength: 128 }
      responses:
        '200':
          description: 已修改
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      revoked_sessions: { type: integer }
                  - $ref: '#/components/schemas/Envelope'
  /api/v2/me/preferences:
    get:
      tags: [identity]
      operationId: getPreferences
      responses:
        '200':
          description: 偏好（ETag = revision）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Preferences'
                  - $ref: '#/components/schemas/Envelope'
    patch:
      tags: [identity]
      operationId: patchPreferences
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PreferencesPatch' }
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Preferences'
                  - $ref: '#/components/schemas/Envelope'
        '412': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
  /api/public/v2/password-resets:
    post:
      tags: [identity]
      operationId: requestPasswordReset
      description: 恒定 202，不泄露邮箱是否存在
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '202':
          description: 已受理
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      status: { type: string }
                  - $ref: '#/components/schemas/Envelope'
        '429': { $ref: '#/components/responses/Error' }
  /api/public/v2/password-resets/resolve:
    post:
      tags: [identity]
      operationId: resolvePasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '200':
          description: 返回脱敏邮箱
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      email: { type: string }
                  - $ref: '#/components/schemas/Envelope'
        '422': { $ref: '#/components/responses/Error' }
  /api/public/v2/password-resets/complete:
    post:
      tags: [identity]
      operationId: completePasswordReset
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, new_password]
              properties:
                token: { type: string }
                new_password: { type: string, minLength: 12, maxLength: 128 }
      responses:
        '200':
          description: 密码已重置并撤销全部会话
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      status: { type: string }
                  - $ref: '#/components/schemas/Envelope'
        '422': { $ref: '#/components/responses/Error' }
  /api/public/v2/organization-invitations/resolve:
    post:
      tags: [identity]
      operationId: resolveOrganizationInvitation
      description: 匿名解析邀请；只返回展示信息，不泄露内部 ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '200':
          description: 邀请展示信息
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResolvedInvitation'
                  - $ref: '#/components/schemas/Envelope'
        '422': { $ref: '#/components/responses/Error' }
  /api/public/v2/organization-invitations/accept:
    post:
      tags: [identity]
      operationId: acceptOrganizationInvitation
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, display_name, password]
              properties:
                token: { type: string }
                display_name: { type: string, maxLength: 80 }
                password: { type: string, minLength: 12, maxLength: 128 }
      responses:
        '200':
          description: 激活成功并下发会话
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AcceptResult'
                  - $ref: '#/components/schemas/Envelope'
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v2/organization:
    get:
      tags: [identity]
      operationId: getOrganization
      responses:
        '200':
          description: 组织资料
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Organization'
                  - $ref: '#/components/schemas/Envelope'
    patch:
      tags: [identity]
      operationId: patchOrganization
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 100 }
      responses:
        '200':
          description: 已更新（组织 admin）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Organization'
                  - $ref: '#/components/schemas/Envelope'
        '412': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
  /api/v2/organization/members:
    get:
      tags: [identity]
      operationId: listOrganizationMembers
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 成员目录（组织 admin）
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/OrganizationMember' }
                      page: { $ref: '#/components/schemas/CursorPage' }
                  - $ref: '#/components/schemas/Envelope'
  /api/v2/organization/members/{userId}:
    get:
      tags: [identity]
      operationId: getOrganizationMember
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: 成员详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OrganizationMember'
                  - $ref: '#/components/schemas/Envelope'
    patch:
      tags: [identity]
      operationId: patchOrganizationMember
      description: 单命令补丁：organization_role 或 status
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [organization_role]
                  properties:
                    organization_role: { type: string, enum: [admin, member] }
                - type: object
                  required: [status]
                  properties:
                    status: { type: string, enum: [active, disabled] }
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OrganizationMember'
                  - $ref: '#/components/schemas/Envelope'
        '409': { $ref: '#/components/responses/Error' }
        '412': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
  /api/v2/organization/invitations:
    get:
      tags: [identity]
      operationId: listOrganizationInvitations
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [pending, accepted, revoked, expired] }
      responses:
        '200':
          description: 邀请记录（不含 token）
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Invitation' }
                      page: { $ref: '#/components/schemas/CursorPage' }
                  - $ref: '#/components/schemas/Envelope'
    post:
      tags: [identity]
      operationId: createOrganizationInvitation
      description: invitation_token 仅在创建响应与邮件中出现一次
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
                display_name: { type: string }
                organization_role: { type: string, enum: [admin, member] }
                grants:
                  type: array
                  maxItems: 50
                  items:
                    type: object
                    properties:
                      workspace_id: { type: string, format: uuid }
                      role: { type: string }
                expires_in_hours: { type: integer }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/InvitationWithToken'
                  - $ref: '#/components/schemas/Envelope'
        '409': { $ref: '#/components/responses/Error' }
  /api/v2/organization/invitations/{invitationId}/resend:
    post:
      tags: [identity]
      operationId: resendOrganizationInvitation
      parameters:
        - $ref: '#/components/parameters/InvitationId'
